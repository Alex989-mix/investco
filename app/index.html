<style>
@font-face{font-family:'Inter';src:url('Inter.woff2') format('woff2');font-weight:100 900;font-style:normal;font-display:swap}
@font-face{font-family:'Space Grotesk';src:url('SpaceGrotesk.woff2') format('woff2');font-weight:300 700;font-style:normal;font-display:swap}
:root{
  --orange:#F7931A; --orange2:#FF8A00; --orange-soft:#2c1e10;
  --bg:#0B1420; --card:#16202E; --card2:#101826; --hero:#091120; --line:#1e2a3a; --line2:#28374a;
  --ink:#E6EDF5; --ink2:#8DA0B5; --ink3:#63788A;
  --pos:#3DD1A0; --posbg:#10321f; --neg:#E86C64; --negbg:#3a1512; --warn:#E7B650; --warnbg:#332703;
  --radius:14px;
}
:root[data-theme="light"]{
  --orange-soft:#FFF1E0;
  --bg:#eef2f6; --card:#ffffff; --card2:#f5f8fb; --hero:#0B1420; --line:#e2e8f0; --line2:#cbd7e3;
  --ink:#0f1b2a; --ink2:#4a5b6e; --ink3:#8496a8;
  --pos:#0f7a4d; --posbg:#e4f4ec; --neg:#c0362c; --negbg:#fbe9e7; --warn:#9a6a00; --warnbg:#fdf3d8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0)}
h1,h2,h3,.k-v,.brandmark{font-family:'Space Grotesk','Inter',sans-serif;letter-spacing:-.01em}
body{padding-bottom:calc(78px + env(safe-area-inset-bottom,0))}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
h1{font-size:20px;font-weight:650}h2{font-size:15px;font-weight:600}
.muted{color:var(--ink2)}.mut3{color:var(--ink3)}.sub{font-size:12.5px;color:var(--ink3)}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.row{display:flex;align-items:center;gap:10px}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius)}
.pad{padding:16px 18px}
.tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;display:inline-block}
.tag.pos{background:var(--posbg);color:var(--pos)}.tag.neg{background:var(--negbg);color:var(--neg)}
.tag.warn{background:var(--warnbg);color:var(--warn)}.tag.or{background:var(--orange-soft);color:var(--orange)}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0)}
.top .wrap{padding:12px 16px}
.brandmark{width:34px;height:34px;border-radius:50%;background:var(--hero);display:flex;align-items:center;justify-content:center}
.btn{font:inherit;font-size:13px;font-weight:550;color:var(--ink);background:var(--card);
  border:1px solid var(--line2);border-radius:10px;padding:7px 12px;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;transition:.12s;-webkit-tap-highlight-color:transparent}
.btn:hover{border-color:var(--ink3)}.btn:active{transform:scale(.97)}
.btn.primary{background:var(--orange);color:#fff;border-color:var(--orange)}
.btn.primary:hover{background:var(--orange2)}
.btn.sm{padding:5px 9px;font-size:12px}.btn.icon{padding:7px 9px}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--card2);
  border-top:1px solid var(--line);display:flex;justify-content:center;gap:2px;
  padding:8px 6px calc(8px + env(safe-area-inset-bottom,0))}
.nav a{flex:1;max-width:120px;text-align:center;padding:6px 2px;border-radius:10px;
  color:var(--ink3);font-size:11px;font-weight:600;cursor:pointer;text-decoration:none;
  display:flex;flex-direction:column;align-items:center;gap:3px;transition:.15s;-webkit-tap-highlight-color:transparent}
.nav a.on{color:var(--orange);background:var(--orange-soft)}
.nav svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{border-radius:var(--radius);padding:15px 16px;background:var(--card);border:1px solid var(--line)}
.kpi.hero{background:var(--hero);border-color:var(--hero)}
.kpi.hero .k-l{color:var(--ink2)}.kpi.hero .k-v{color:#fff}
.k-l{font-size:12.5px;color:var(--ink2);font-weight:500}
.k-v{font-size:25px;font-weight:650;margin-top:5px;font-variant-numeric:tabular-nums}
.k-s{font-size:12.5px;margin-top:2px;font-weight:500}
.sec{margin-top:22px}.sec-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:11px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.03em;text-align:right;padding:9px 10px;border-bottom:1px solid var(--line)}
th:first-child{text-align:left}
td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;vertical-align:middle}
td:first-child{text-align:left}tr:last-child td{border-bottom:0}
.t-name{font-weight:600;color:var(--ink)}.t-sub{font-size:11.5px;color:var(--ink3);font-weight:400}
.twrap{overflow-x:auto}
tfoot td{font-weight:700;border-top:2px solid var(--line2);border-bottom:0;color:var(--ink)}
.dot{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:7px;vertical-align:-1px}
.leg{display:flex;flex-direction:column;gap:8px}
.leg .li{display:flex;align-items:center;gap:9px;font-size:13.5px}
.leg .bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;flex:1;max-width:110px}
.leg .bar>span{display:block;height:100%;transition:width .5s ease}
.ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;
  padding:20px 20px calc(24px + env(safe-area-inset-bottom,0));max-height:92vh;overflow-y:auto;animation:slideUp .28s cubic-bezier(.2,.8,.2,1)}
@media(min-width:640px){.ov{align-items:center}.sheet{border-radius:18px}}
@keyframes slideUp{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.field{margin-top:13px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink2);margin-bottom:5px}
input,select{width:100%;font:inherit;font-size:14px;color:var(--ink);background:var(--card2);
  border:1px solid var(--line2);border-radius:10px;padding:10px 11px;transition:.12s}
input:focus,select:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 3px rgba(247,147,26,.18)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.hint{font-size:11.5px;color:var(--ink3);margin-top:5px;line-height:1.5}
.codebox{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:6px;font-family:'SF Mono',ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:var(--orange);word-break:break-all;cursor:pointer}
.codebox:active{opacity:.6}
.del{color:var(--neg);cursor:pointer;font-size:12px;font-weight:600}
.empty{text-align:center;padding:34px 20px;color:var(--ink3);font-size:13.5px}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);z-index:80;background:var(--orange);color:#fff;
  font-size:13px;font-weight:600;padding:10px 16px;border-radius:12px;opacity:0;transition:.25s;pointer-events:none;max-width:90%}
.toast.on{opacity:1}.toast.err{background:var(--neg)}
.note{font-size:12px;color:var(--ink3);line-height:1.6;margin-top:8px}
.view{display:none}.view.on{display:block;animation:fadeIn .25s ease}
.addbtn{width:100%;border:1.5px dashed var(--line2);background:transparent;color:var(--ink2);
  border-radius:12px;padding:12px;font:inherit;font-weight:600;font-size:13.5px;cursor:pointer;transition:.15s}
.addbtn:hover{border-color:var(--orange);color:var(--orange)}
.subtabs{display:flex;gap:6px;margin:16px 0 4px}
.subtab{flex:1;text-align:center;padding:9px;border-radius:10px;font-size:13px;font-weight:600;color:var(--ink2);background:var(--card);border:1px solid var(--line);cursor:pointer;transition:.15s}
.subtab.on{color:var(--orange);border-color:var(--orange);background:var(--orange-soft)}
.live-b{white-space:nowrap;font-size:11px;font-weight:600;color:var(--ink3);margin-left:6px;vertical-align:middle;font-family:inherit}.live-b.on{color:var(--pos)}
.chk{width:26px;height:26px;border-radius:8px;border:1.5px solid var(--line2);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:transparent;font-weight:800;transition:.15s;flex:none}
.chk.on{background:var(--pos);border-color:var(--pos);color:#fff}
.chk.miss{border-color:var(--neg);color:var(--neg)}
.pill-status{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px}
canvas{max-width:100%}
.count{transition:none}
#splash{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .4s ease}
#splash .sp-logo{width:78px;height:78px;border-radius:50%;background:var(--hero);display:flex;align-items:center;justify-content:center;animation:pop .5s cubic-bezier(.2,.9,.3,1.3)}
#splash .sp-name{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;color:var(--ink);letter-spacing:-.01em}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.updbar{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom,0));z-index:90;background:var(--orange);color:#fff;
  border-radius:12px;padding:12px 16px;display:none;align-items:center;justify-content:space-between;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.3);animation:slideUp .3s ease}
.updbar.on{display:flex}.updbar b{font-weight:700}
.bud-nav{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:12px}
.bud-nav button{background:var(--card);border:1px solid var(--line2);color:var(--ink);width:34px;height:34px;border-radius:50%;font-size:16px;cursor:pointer}
.bud-nav .lbl{font-weight:600;font-size:15px;min-width:130px;text-align:center;text-transform:capitalize}
.progress{height:7px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:5px}
.progress>span{display:block;height:100%;transition:width .5s ease}
.emptybox{text-align:center;padding:30px 20px;color:var(--ink3)}
.emptybox .ic{font-size:30px;opacity:.5;margin-bottom:8px}
input.bad{border-color:var(--neg)!important;box-shadow:0 0 0 2px var(--negbg)}
#lock{position:fixed;inset:0;z-index:300;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;padding-top:calc(24px + env(safe-area-inset-top,0))}
#lock.on{display:flex}
#lock .lk-logo{width:64px;height:64px;border-radius:50%;background:var(--hero);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center}
#lock h2{margin-top:14px;font-family:'Space Grotesk';font-size:20px}
#lock .dots{display:flex;gap:12px;margin:18px 0 6px;height:16px}
#lock .dots i{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--line2)}
#lock .dots i.f{background:var(--orange);border-color:var(--orange)}
#lock .msg{min-height:20px;font-size:13px;color:var(--neg);text-align:center}
#lock .pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px;margin-top:12px}
#lock .pad button{height:72px;border-radius:50%;border:1px solid var(--line2);background:var(--card);color:var(--ink);font:600 24px 'Space Grotesk';cursor:pointer}
#lock .pad button:active{background:var(--orange-soft)}
#lock .pad .ghost{background:transparent;border-color:transparent;font-size:15px;font-family:'Inter'}
#lock .lk-links{margin-top:18px;display:flex;gap:18px;font-size:13px}
#lock .lk-links a{color:var(--ink2);cursor:pointer}
#lock.shake .dots{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
</style>
</head>

<script>/* Librairie de graphiques indisponible (hors ligne, CDN bloqué) : objet neutre pour que l'appli démarre quand même */
if(!window.Chart){window.Chart=function(){return{destroy(){},update(){},data:{datasets:[{data:[]}],labels:[]},options:{}};};window.Chart.missing=true;}</script>
<script>if(window.pdfjsLib)pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';</script>
<script>
const $=(s,e=document)=>e.querySelector(s);
const EUR=new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:2});
const EUR0=new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0});
const eur=v=>EUR.format(v||0),eur0=v=>EUR0.format(v||0);
const PCT=v=>(v>=0?'+':'')+(v*100).toFixed(2).replace('.',',')+' %';
const PCT1=v=>(v*100).toFixed(1).replace('.',',')+' %';
const QTY=v=>new Intl.NumberFormat('fr-FR',{maximumFractionDigits:8}).format(v);
// ---- Dates : tout en heure locale (Paris). 'AAAA-MM-JJ' est lu comme minuit local, jamais en UTC.
const today=()=>new Date();
const pd=s=>{if(s instanceof Date)return new Date(s.getTime());if(typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}return new Date(s);};
const ymd=d=>{d=pd(d);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const monthsBetween=(a,b)=>{a=pd(a);b=pd(b);return (b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth())+(b.getDate()>=a.getDate()?0:-1);};
// Ajoute n mois ; si le jour n'existe pas (31 → février), on prend le dernier jour du mois
const addMonths=(d,n)=>{d=pd(d);const day=d.getDate();const r=new Date(d.getFullYear(),d.getMonth()+n,1,d.getHours(),d.getMinutes(),d.getSeconds());

function assetCalc(a){

// Échéancier : versement n°k au « jour de versement » du k-ième mois après la souscription (fin de mois gérée)
function crowdSchedule(c){const out=[],s=pd(c.sub),day=+c.day||s.getDate();
  for(let k=1;k<=(c.dur||0);k++){const last=new Date(s.getFullYear(),s.getMonth()+k+1,0).getDate();
    const d=new Date(s.getFullYear(),s.getMonth()+k,Math.min(day,last));out.push({k,d,mk:ymKey(d)});}return out;}
function crowdCalc(c,now=today()){
  // Versement mensuel calculé depuis le taux annuel, arrondi au centime
  const monthly=r2((c.amt||0)*(c.rate||0)/12);
  const sch=crowdSchedule(c),ech=addMonths(c.sub,c.dur||0);
  const due=sch.filter(p=>p.d<=now),paid=new Set(c.paid||[]);
  const received=sch.filter(p=>paid.has(p.mk)).length;
  const missing=due.filter(p=>!paid.has(p.mk)).length;
  const next=sch.find(p=>p.d>now)||null;
  return {monthly,sch,due,ech,next,elapsed:due.length,received,receivedAmt:r2(received*monthly),missing,
    remaining:sch.length-due.length,mature:now>=ech,capital:crowdActive(c)?(c.amt||0):0};}
// Intérêts imposables d'une année : versements pointés + versements échus non pointés d'un projet « En cours »
function crowdYearInterest(c,y){const cc=crowdCalc(c),paid=new Set(c.paid||[]);
  return r2(cc.due.filter(p=>p.d.getFullYear()===y&&(paid.has(p.mk)||c.st==='En cours')).length*cc.monthly);}

function compteCourant(){return DB.savings.find(s=>s.type==='Compte courant');}
function monthExpenses(ymk){return DB.expenses.filter(e=>ymKey(e.d)===ymk);}
function catBreakdown(ymk){const o={};monthExpenses(ymk).forEach(e=>{o[e.cat]=(o[e.cat]||0)+e.amt;});return o;}
function runRecurring(){
  const cc=compteCourant();const now=today();let changed=false;
  if(!DB.settings.lastProc){DB.settings.lastProc=ymd(now);return;}
  const last=new Date(DB.settings.lastProc);
  DB.recurring.filter(r=>r.active).forEach(r=>{
    let d=new Date(Math.max(new Date(r.start),new Date(last.getFullYear(),last.getMonth(),1)));
    for(let k=0;k<60;k++){const due=new Date(d.getFullYear(),d.getMonth(),Math.min(r.day,28));
      if(due>last&&due<=now){DB.expenses.push({d:ymd(due),label:r.label,amt:r.amt,cat:r.cat,auto:true});
        changed=true;}
      d=addMonths(d,1);if(due>now)break;}
  });
  DB.settings.lastProc=ymd(now);if(changed)save();
}

// ---- Immobilier locatif et crédits
const loansOf=(pid)=>(DB.loans||[]).filter(l=>l.propertyId===pid);
function loanCalc(l){return Fin.loanStatus(l,ymd(today()));}
function propertyCalc(p){const t=ymd(today());
  const lm=loansOf(p.id).map(loanCalc).filter(s=>s.remainingCount>0).reduce((a,s)=>a+s.monthlyTotal,0);
  const crd=loansOf(p.id).reduce((a,l)=>a+loanCalc(l).crd,0);
  const value=Fin.propertyValue(p,t);
  return Object.assign({value,crd,equity:r2(value-crd),loanMonthly:r2(lm)},Fin.propertyStats(p,lm,value));}
function realEstate(){const P=(DB.properties||[]).map(propertyCalc);
  return {value:r2(P.reduce((a,x)=>a+x.value,0)),cost:r2((DB.properties||[]).reduce((a,p)=>a+Fin.propertyCost(p),0)),
    debt:r2((DB.loans||[]).reduce((a,l)=>a+loanCalc(l).crd,0)),cashflow:r2(P.reduce((a,x)=>a+x.cashflow,0)),
    principalYear:r2((DB.loans||[]).reduce((a,l)=>a+loanCalc(l).principalYear,0))};}
function consolidate(){
  let bI=0,bV=0;DB.assets.forEach(a=>{const c=assetCalc(a);bI+=c.inv;bV+=c.value;});
  let iI=0,iV=0;DB.crowd.filter(crowdActive).forEach(c=>{iI+=c.amt||0;iV+=c.amt||0;});
  let sI=0,sV=0,sN=0,dispo=0;DB.savings.forEach(s=>{const c=savingCalc(s);sI+=c.versed;sV+=(s.cap||0);sN+=c.net;if(c.cat!=='Assurance-vie')dispo+=(s.cap||0);});
  const RE=realEstate();const PEA=peaCalc(),peaCash=PEA.real&&PEA.cash>0?PEA.cash:0;
  bI+=peaCash;bV+=peaCash;
  const invested=bI+iI+sI+RE.cost,value=bV+iV+sV+RE.value,net=r2(value-RE.debt); // patrimoine net = actifs − capital restant dû
  const immoMonthly=DB.crowd.filter(c=>c.st==='En cours').reduce((a,c)=>a+crowdCalc(c).monthly*(1-crowdTaxRate()),0);
  const y=today().getFullYear(),jan=new Date(y,0,1);let apports=0;
  DB.movements.forEach(m=>{if(new Date(m.d)>=jan){if(m.t==='Transfert'||m.t==='Intérêts'||m.t==='Ajustement'||m.t==='Dividende')return;const g=(m.q!=null&&m.pu!=null)?m.q*m.pu:(m.m||0);const amt=g+(m.f||0);if(m.t==='Achat'||m.t==='Dépôt')apports+=amt;else apports-=amt;}});
  DB.crowd.forEach(c=>{if(new Date(c.sub)>=jan)apports+=c.amt;});
  apports+=RE.principalYear; // le capital de crédit remboursé est un effort d'épargne, pas un gain
  // argent envoyé du compte courant vers une plateforme : il réapparaît dans l'actif acheté (déjà compté en apport)
  DB.expenses.forEach(e=>{if(e.cat==='Investissement'&&pd(e.d)>=jan)apports-=(+e.amt||0);});
  const snap=DB.settings.snapshots[y];const yearGain=snap!=null?net-snap-apports:null;
  const yearPerf=(snap!=null&&(snap+apports)>0)?yearGain/(snap+apports):null;
  return {invested,value,net,debt:RE.debt,reValue:RE.value,reCashflow:RE.cashflow,pv:value-invested,pvp:invested?(value-invested)/invested:0,bI,bV,iI,iV,sI,sV,sN,dispo,immoMonthly,apports,snap,yearGain,yearPerf};
}
function repartition(){const g=k=>DB.assets.filter(a=>a.type===k);const sum=(a,f)=>a.reduce((x,y)=>x+f(y),0);
  const A=g('Action'),E=g('ETF'),C=g('Crypto'),cf=DB.crowd.filter(crowdActive);
  const sav=cat=>DB.savings.filter(s=>savingCalc(s).cat===cat);
  const rows=[['Actions',sum(A,a=>assetCalc(a).inv),sum(A,a=>assetCalc(a).value)],
    ['ETF',sum(E,a=>assetCalc(a).inv),sum(E,a=>assetCalc(a).value)],
    ['Crypto',sum(C,a=>assetCalc(a).inv),sum(C,a=>assetCalc(a).value)],
    ['Crowdfunding immobilier',sum(cf,c=>c.amt||0),sum(cf,c=>c.amt||0)],
    ['Immobilier',sum(DB.properties||[],p=>Fin.propertyCost(p)),sum(DB.properties||[],p=>Fin.propertyValue(p,ymd(today())))],
    ['Épargne réglementée',sum(sav('Épargne réglementée'),s=>savingCalc(s).versed),sum(sav('Épargne réglementée'),s=>s.cap||0)],
    ['Assurance-vie',sum(sav('Assurance-vie'),s=>savingCalc(s).versed),sum(sav('Assurance-vie'),s=>s.cap||0)],
    ['Liquidités',sum(sav('Liquidités'),s=>savingCalc(s).versed)+(peaCalc().real?Math.max(0,peaCalc().cash):0),sum(sav('Liquidités'),s=>s.cap||0)+(peaCalc().real?Math.max(0,peaCalc().cash):0)]];
  const tot=rows.reduce((a,r)=>a+r[2],0)||1;
  return rows.map(r=>({name:r[0],inv:r[1],val:r[2],pv:r[2]-r[1],part:r[2]/tot}));
}

function fiscalData(){
  const y=today().getFullYear(),jan=new Date(y,0,1);
  let pelInt=0,pelName='',livretBancaireInt=0,celInt=0,hasExo=false;
  DB.savings.forEach(s=>{
    if(['Livret A','LDDS','LEP','Livret Jeune'].includes(s.type))hasExo=true;
    if(s.type==='PEL'){const oy=s.open?new Date(s.open).getFullYear():y;const age=s.open?monthsBetween(s.open,today())/12:0;
      if(oy>=2018||age>=12){pelInt+=savingCalc(s).brut;pelName=s.name;}}
    else if(s.type==='Livret bancaire')livretBancaireInt+=savingCalc(s).brut;
    else if(s.type==='CEL'){const oy=s.open?new Date(s.open).getFullYear():y;if(oy>=2018)celInt+=savingCalc(s).brut;}
  });
  let bricks=0;DB.crowd.forEach(c=>{bricks+=crowdYearInterest(c,y);});bricks=r2(bricks);
  const interestsTotal=pelInt+livretBancaireInt+celInt+bricks;
  let pvStock=0,pvCrypto=0;
  // Plus-values réalisées de l'année, calculées au PRU du moment de chaque vente
  DB.assets.forEach(a=>{if(a.env==='PEA')return; // les ventes à l'intérieur du PEA ne sont pas imposées tant que le plan reste ouvert
    assetCalc(a).realized.filter(r=>pd(r.d).getFullYear()===y).forEach(r=>{if(a.type==='Crypto')pvCrypto+=r.pv;else pvStock+=r.pv;});});
  let revRevenue=0,revCount=0;DB.resale.forEach(r=>{if(r.st==='Vendu'&&r.sellD&&new Date(r.sellD)>=jan){revRevenue+=r.sell||0;revCount++;}});
  const revBase=Fin.resaleYear(DB.resale,y,{regime:DB.settings.resaleRegime,abattement:param('revente.microbic.abattement')}).taxable;
  let avRachat=0,avTaxable=0,avAbat=0,avOver8=false;
  DB.savings.filter(s=>s.type==='Assurance-vie').forEach(s=>{
    const rachat=DB.movements.filter(m=>m.t==='Retrait'&&m.p===s.name&&new Date(m.d)>=jan).reduce((a,m)=>a+(m.m||0),0);
    if(rachat>0){avRachat+=rachat;const sc=savingCalc(s);const base=(s.cap||0)+rachat;const ratio=base>0?Math.max(0,sc.gains)/base:0;let g=rachat*ratio;
      const o8=s.open&&monthsBetween(s.open,today())>=96;if(o8){avOver8=true;const ab=param('tax.av.abattement')||0;avAbat+=Math.min(g,ab);g=Math.max(0,g-ab);}avTaxable+=g;}
  });
  let avNext=null;DB.savings.filter(s=>s.type==='Assurance-vie'&&s.open).forEach(s=>{const yr=new Date(s.open).getFullYear()+8;if(avNext==null||yr<avNext)avNext=yr;});
  const rate=taxBareme();
  const totalTaxable=interestsTotal+Math.max(0,pvStock)+Math.max(0,pvCrypto)+revBase+avTaxable;
  return {y,pelInt,pelName,celInt,livretBancaireInt,bricks,interestsTotal,hasExo,pvStock,pvCrypto,revRevenue,revCount,revBase,avRachat,avTaxable,avAbat,avOver8,avNext,rate,totalTaxable,estTax:totalTaxable*rate};
}

  {const dv=DB.assets.filter(a=>a.env!=='PEA').reduce((t,a)=>t+assetCalc(a).divsY,0),dp=DB.assets.filter(a=>a.env==='PEA').reduce((t,a)=>t+assetCalc(a).divsY,0);

/* ======================= PERFORMANCE : TRI (XIRR) + TWR + indice ======================= */
function cashFlows(){
  const cf=[];
  DB.movements.forEach(m=>{
    if(m.t==='Transfert'||m.t==='Intérêts'||m.t==='Ajustement')return;
    const g=(m.q!=null&&m.pu!=null&&m.q!==''&&m.pu!=='')?(+m.q)*(+m.pu):(+m.m||0);
    const amt=g+(+m.f||0); if(!amt)return;
    const d=new Date(m.d); if(isNaN(d))return;
    if(m.t==='Achat'||m.t==='Dépôt')cf.push({d,a:-amt}); else cf.push({d,a:+amt});
  });
  DB.crowd.forEach(c=>{if(c.sub){const d=new Date(c.sub);if(!isNaN(d))cf.push({d,a:-(+c.amt||0)});}});
  return cf.sort((a,b)=>a.d-b.d);
}
function xirr(flows,finalVal){
  const cf=flows.slice(); cf.push({d:today(),a:finalVal});
  if(cf.length<2)return null;
  if(!cf.some(x=>x.a<0)||!cf.some(x=>x.a>0))return null;
  const t0=cf[0].d, yrs=x=>(x.d-t0)/(365.25*86400000);
  const npv=r=>cf.reduce((s,x)=>s+x.a/Math.pow(1+r,yrs(x)),0);
  let lo=-0.9999,hi=10,flo=npv(lo),fhi=npv(hi);
  if(flo*fhi>0){hi=100;fhi=npv(hi);if(flo*fhi>0)return null;}
  for(let i=0;i<200;i++){const mid=(lo+hi)/2,fm=npv(mid);if(Math.abs(fm)<1e-4||(hi-lo)<1e-10)return mid;if(flo*fm<0){hi=mid;}else{lo=mid;flo=fm;}}
  return (lo+hi)/2;
}
function monthlySeries(){
  const snaps=DB.settings.snapshots||{},map={};
  Object.keys(snaps).forEach(k=>{if(snaps[k]==null)return;const mk=/^\d{4}$/.test(k)?k+'-01':k;map[mk]=+snaps[k];});
  const curM=ymKey(today()); map[curM]=Math.round(consolidate().value);
  return Object.keys(map).sort().map(m=>({m,v:map[m]}));
}
function flowByMonth(){const f={};cashFlows().forEach(x=>{const k=ymKey(x.d);f[k]=(f[k]||0)+(-x.a);});return f;}
function twrSeries(){
  const ser=monthlySeries(); if(ser.length<2)return null;
  const fm=flowByMonth(); let idx=100; const out=[{m:ser[0].m,base:100}];
  for(let i=1;i<ser.length;i++){const v0=ser[i-1].v,v1=ser[i].v,flow=fm[ser[i].m]||0;
    if(v0>0){const hpr=(v1-flow)/v0; if(hpr>0&&isFinite(hpr))idx*=hpr;} out.push({m:ser[i].m,base:+idx.toFixed(2)});}
  return out;
}
function perfStats(){
  const val=consolidate().value, flows=cashFlows();
  const irr=xirr(flows,val), tw=twrSeries();
  let twr=null,twrAnnual=null;
  if(tw&&tw.length>=2){twr=tw[tw.length-1].base/100-1;
    const d0=new Date(tw[0].m+'-01'),d1=new Date(tw[tw.length-1].m+'-01'),spanY=(d1-d0)/(365.25*86400000);
    if(spanY>0.08)twrAnnual=Math.pow(1+twr,1/spanY)-1;}
  return {val,irr,twr,twrAnnual,tw};
}
function perfHtml(){
  const p=perfStats(),ch=DB.settings.indexChoice;
  const tri=p.irr!=null?PCT(p.irr):'—';   // PCT ajoute déjà le signe +
  const twr=p.twr!=null?PCT(p.twr):'—';
  const twrA=p.twrAnnual!=null?PCT(p.twrAnnual):'—';
  return `<div class="sec"><div class="sec-h"><h2>Performance</h2><button class="btn sm" onclick="openGuide()">Aide</button></div>
   <div class="kpis">
     <div class="kpi"><div class="k-l">TRI annualisé</div><div class="k-v ${p.irr>=0?'pos':'neg'}" style="font-size:21px">${tri}</div><div class="k-s muted">rendement réel, flux pondérés (XIRR)</div></div>
     <div class="kpi"><div class="k-l">Perf. cumulée (TWR)</div><div class="k-v ${p.twr>=0?'pos':'neg'}" style="font-size:21px">${twr}</div><div class="k-s muted">hors versements · ${twrA}/an</div></div>
   </div>

async function fetchIndexSeries(sym){
  const key=DB.settings.stockKey; if(!key)throw new Error('clé API manquante');
  const cache=(DB.settings.indexCache||{})[sym];
  if(cache&&(Date.now()-cache.ts)<20*3600*1000)return cache.data;
  const r=await fetch(`https://api.twelvedata.com/time_series?symbol=${encodeURIComponent(sym)}&interval=1month&outputsize=120&apikey=${key}`);
  const d=await r.json();
  if(!d||!d.values||!Array.isArray(d.values))throw new Error(d&&d.message?d.message:'données indisponibles');
  const data={}; d.values.forEach(v=>{data[v.datetime.slice(0,7)]=+v.close;});
  DB.settings.indexCache[sym]={ts:Date.now(),data}; applyingRemote=true;save();applyingRemote=false;
  return data;
}
async function renderPerfChart(){
  const cv=$('#perf'); if(!cv)return;
  const p=perfStats(), note=$('#perfnote');
  const tick=getComputedStyle(document.documentElement).getPropertyValue('--ink3')||'#63788A';
  if(perfChart){perfChart.destroy();perfChart=null;}
  if(!p.tw||p.tw.length<2){if(note)note.textContent="Pas encore assez d'historique (un point s'ajoute chaque mois). Le TRI est déjà calculé ci-dessus.";return;}
  const labels=p.tw.map(x=>x.m), port=p.tw.map(x=>x.base);
  perfChart=new Chart(cv,{type:'line',data:{labels,datasets:[{label:'Mon portefeuille',data:port,borderColor:'#F7931A',backgroundColor:'rgba(247,147,26,.10)',fill:true,tension:.3,pointRadius:2}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:true,labels:{color:tick,boxWidth:12,font:{size:11}}}},scales:{x:{ticks:{color:tick,font:{size:10},maxTicksLimit:6}},y:{ticks:{color:tick}}}}});
  const ch=DB.settings.indexChoice, sym=(DB.settings.benchSym||{})[ch], nm=ch==='MSCI'?'MSCI World':'CAC 40';
  if(!DB.settings.stockKey){if(note)note.textContent='Ajoute ta clé API cours (Réglages ▸ Aide) pour superposer l\'indice '+nm+'.';return;}
  try{
    const data=await fetchIndexSeries(sym);
    const first=labels.find(m=>data[m]!=null);
    if(first==null){if(note)note.textContent='Indice '+nm+' indisponible sur cette période (symbole '+sym+', modifiable dans Réglages).';return;}
    const base=data[first];
    const idxLine=labels.map(m=>data[m]!=null?+(data[m]/base*100).toFixed(2):null);
    perfChart.data.datasets.push({label:nm,data:idxLine,borderColor:'#6BA3C6',borderDash:[5,4],fill:false,tension:.3,pointRadius:0,spanGaps:true});

  }catch(e){if(note)note.textContent='Indice '+nm+' indisponible ('+(e.message||'erreur')+'). Vérifie la clé et le symbole dans Réglages.';}
}

let gisReady=false,gTokenClient=null,gAccessToken=null,gTokenExp=0,autoSyncT=null;
function loadGIS(){return new Promise((res,rej)=>{
  if(window.google&&google.accounts&&google.accounts.oauth2){gisReady=true;return res();}
  const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.async=true;s.defer=true;
  s.onload=()=>{gisReady=true;res();};s.onerror=()=>rej(new Error('Google injoignable (hors-ligne ?)'));
  document.head.appendChild(s);});}
function getToken(interactive){return new Promise((res,rej)=>{
  const cid=DB.settings.gdriveClientId; if(!cid)return rej(new Error('ID client manquant'));
  if(gAccessToken&&Date.now()<gTokenExp-60000)return res(gAccessToken);
  if(!gTokenClient||gTokenClient._cid!==cid){
    gTokenClient=google.accounts.oauth2.initTokenClient({client_id:cid,scope:'https://www.googleapis.com/auth/drive.appdata',
      callback:resp=>{if(resp.error){rej(new Error(resp.error));return;}gAccessToken=resp.access_token;gTokenExp=Date.now()+(resp.expires_in||3600)*1000;res(gAccessToken);},
      error_callback:err=>rej(new Error(err&&err.type?err.type:'auth annulée'))});
    gTokenClient._cid=cid;
  }
  try{gTokenClient.callback=resp=>{if(resp.error){rej(new Error(resp.error));return;}gAccessToken=resp.access_token;gTokenExp=Date.now()+(resp.expires_in||3600)*1000;res(gAccessToken);};
    gTokenClient.requestAccessToken({prompt:interactive?'consent':''});}catch(e){rej(e);}});}
async function driveFind(tok){
  const r=await fetch("https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q="+encodeURIComponent("name='investco-backup.json'")+"&fields=files(id,modifiedTime)",{headers:{Authorization:'Bearer '+tok}});
  if(!r.ok)throw new Error('Drive '+r.status); const d=await r.json(); return d.files&&d.files.length?d.files[0]:null;}
async function driveGet(tok,id){const r=await fetch('https://www.googleapis.com/drive/v3/files/'+id+'?alt=media',{headers:{Authorization:'Bearer '+tok}});if(!r.ok)throw new Error('Drive '+r.status);return Fin.deserialize(await r.json());}
async function driveSave(tok,id,obj){
  const body=JSON.stringify(Fin.serialize(obj)),meta={name:'investco-backup.json'}; if(!id)meta.parents=['appDataFolder'];
  const b='-------investco'+Date.now();
  const mp='--'+b+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify(meta)+'\r\n--'+b+'\r\nContent-Type: application/json\r\n\r\n'+body+'\r\n--'+b+'--';
  const url=id?('https://www.googleapis.com/upload/drive/v3/files/'+id+'?uploadType=multipart&fields=id'):'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id';
  const r=await fetch(url,{method:id?'PATCH':'POST',headers:{Authorization:'Bearer '+tok,'Content-Type':'multipart/related; boundary='+b},body:mp});
  if(!r.ok)throw new Error('Drive '+r.status); const d=await r.json(); return d.id;}
async function syncNow(interactive){
  if(!DB.settings.gdriveClientId){toast('Configure l\'ID client Google (Réglages)',true);return;}
  toast('Synchronisation…');
  try{
    await loadGIS(); const tok=await getToken(interactive!==false);
    const f=await driveFind(tok);
    if(f){
      DB.settings.gdriveFileId=f.id; const remote=await driveGet(tok,f.id);
      const rT=(remote&&remote.meta&&remote.meta.updatedAt)||0, lT=(DB.meta&&DB.meta.updatedAt)||0;
      if(rT>lT){applyingRemote=true;backupLocal('Avant récupération depuis Drive');DB=remote;load2();DB.settings.lastSync=new Date().toISOString();save();applyingRemote=false;renderAll();toast('Récupéré depuis Drive ✓');}
      else if(lT>rT){await driveSave(tok,f.id,DB);DB.settings.lastSync=new Date().toISOString();applyingRemote=true;save();applyingRemote=false;toast('Sauvegardé sur Drive ✓');}
      else{DB.settings.lastSync=new Date().toISOString();applyingRemote=true;save();applyingRemote=false;toast('Déjà à jour ✓');}
    }else{
      const id=await driveSave(tok,null,DB);DB.settings.gdriveFileId=id;DB.settings.lastSync=new Date().toISOString();applyingRemote=true;save();applyingRemote=false;toast('Sauvegardé sur Drive ✓');
    }
    if($('#syncstat'))refreshSyncUI();
  }catch(e){toast('Sync : '+(e.message||e),true);}
}
async function pushQuiet(){
  if(!DB.settings.gdriveClientId)return;
  try{await loadGIS();const tok=await getToken(false);let id=DB.settings.gdriveFileId;
    if(!id){const f=await driveFind(tok);id=f&&f.id;}
    const nid=await driveSave(tok,id,DB);DB.settings.gdriveFileId=nid;DB.settings.lastSync=new Date().toISOString();
    applyingRemote=true;save();applyingRemote=false; if($('#syncstat'))refreshSyncUI();
  }catch(e){}
}
function scheduleAutoSync(){clearTimeout(autoSyncT);autoSyncT=setTimeout(pushQuiet,4000);}
function refreshSyncUI(){const el=$('#syncstat');if(!el)return;const ls=DB.settings.lastSync;
  el.textContent=ls?('Dernière synchro : '+new Date(ls).toLocaleString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})):'Jamais synchronisé.';}
function disconnectDrive(){gAccessToken=null;gTokenExp=0;gTokenClient=null;DB.settings.gdriveFileId=null;save();toast('Déconnecté de Drive');if($('#syncstat'))refreshSyncUI();}

  const types=['Livret A','LDDS','LEP','Livret Jeune','PEL','CEL','Livret bancaire','Assurance-vie','Compte courant','Autre'],taxes=['Exonéré','PFU standard','PFU assurance-vie','Barème'];
  openSheet(`<div class="spread"><h2>${i>=0?'Modifier':'Nouveau'} produit</h2><button class="btn sm" onclick="closeSheet()">Fermer</button></div>
   <div class="two"><div class="field"><label>Nom</label><input id="s_name" value="${esc(s.name)}"></div><div class="field"><label>Type</label><select id="s_type">${types.map(t=>`<option ${s.type===t?'selected':''}>${t}</option>`).join('')}</select></div></div>
   <div class="two"><div class="field"><label>Établissement</label><input id="s_bank" value="${esc(s.bank||'')}"></div><div class="field"><label>Solde actuel (€)</label><input type="text" inputmode="decimal" autocomplete="off" id="s_cap" value="${fin(s.cap??'')}"></div></div>
   <div class="two"><div class="field"><label>Date d'ouverture</label><input type="date" id="s_open" value="${s.open||''}"></div><div class="field"><label>Taux manuel (%)</label><input type="text" inputmode="decimal" autocomplete="off" id="s_rate" value="${fin(s.rate!=null&&s.rate!==''?(s.rate*100):'')}" placeholder="auto"></div></div>
   <div class="two"><div class="field"><label>Fiscalité</label><select id="s_tax">${taxes.map(t=>`<option ${s.tax===t?'selected':''}>${t}</option>`).join('')}</select></div><div class="field"><label>Plafond de versements (€)</label><input type="text" inputmode="decimal" autocomplete="off" id="s_ceil" value="${fin(s.ceil??'')}" placeholder="${param('ceil.'+(s.type||'Livret A'))!=null?'réglementaire : '+fin(param('ceil.'+(s.type||'Livret A'))):'aucun'}"></div></div>
   <div class="hint">Taux vide = automatique (livrets réglementés). Le solde est calculé depuis les opérations ; si tu le modifies ici, l'écart est enregistré comme une opération (dépôt d'ouverture pour un produit sans opération, sinon « Ajustement » daté d'aujourd'hui). Le compte courant sert de base au Budget.</div>
   <div class="row" style="margin-top:16px;gap:8px"><button class="btn primary" style="flex:1" onclick="saveSaving(${i})">Enregistrer</button>${i>=0?`<button class="btn" onclick="delSaving(${i})" style="color:var(--neg)">Supprimer</button>`:''}</div>`);}
function saveSaving(i){const name=$('#s_name').value.trim();if(!name){toast('Nom ?',true);return;}const r=num('s_rate');
  const capIn=num('s_cap'),ceil=num('s_ceil');
  if(DB.savings.some((x,k)=>k!==i&&x.name===name)){toast('Un produit porte déjà ce nom',true);return;}
  const o={name,type:$('#s_type').value,bank:$('#s_bank').value.trim(),cap:0,open:val('s_open'),rate:r==null?null:r/100,tax:$('#s_tax').value,ceil};
  if(i>=0){const old=DB.savings[i].name;
    if(old!==name)DB.movements.forEach(m=>{if(m.p===old)m.p=name;if(m.p2===old)m.p2=name;}); // les opérations suivent le nouveau nom
    DB.savings[i]=o;}else DB.savings.push(o);
  // Capital saisi : on n'écrase pas le solde, on enregistre l'écart comme une opération datée
  // (produit sans aucune opération → dépôt d'ouverture ; sinon → ajustement daté d'aujourd'hui)
  if(capIn!=null){const diff=r2(capIn-savingBalance(o)),hasOps=DB.movements.some(m=>m.p===name||m.p2===name);
    if(Math.abs(diff)>=0.005)DB.movements.push(hasOps
      ?{d:ymd(today()),p:name,t:'Ajustement',q:null,pu:null,m:diff,f:0,n:'Correction du solde'}
      :{d:o.open||ymd(today()),p:name,t:'Dépôt',q:null,pu:null,m:diff,f:0,n:'Solde à l\'ouverture'});}
  save();closeSheet();renderAll();toast('Produit enregistré');}
function delSaving(i){const n=DB.savings[i].name;const k=DB.movements.filter(m=>m.p===n||m.p2===n).length;
  if(k&&!confirm('Supprimer « '+n+' » et ses '+k+' opération(s) ?'))return;
  DB.movements=DB.movements.filter(m=>m.p!==n&&m.p2!==n);DB.savings.splice(i,1);save();closeSheet();renderAll();toast('Supprimé');}

const CG={BTC:'bitcoin','BTC-EUR':'bitcoin',ETH:'ethereum','ETH-EUR':'ethereum',SOL:'solana','SOL-EUR':'solana',ADA:'cardano',XRP:'ripple',DOGE:'dogecoin',BNB:'binancecoin',DOT:'polkadot'};
// Déduit le symbole Yahoo Finance (couvre Euronext Paris / PEA / Amundi sans clé API)
function yahooSym(a){
  if(a.ysym)return a.ysym.trim();
  let t=(a.ticker||'').trim();if(!t)return '';
  if(t.includes('.'))return t.replace(/\.PAR$/i,'.PA'); // .PAR (Alpha Vantage) -> .PA (Yahoo)
  if(a.cur==='USD')return t;                 // US : ticker brut (AAPL…)
  return t+'.PA';                            // défaut Euronext Paris (PEA, Amundi…)
}
async function yahooQuote(sym){
  for(const h of ['https://query1.finance.yahoo.com','https://query2.finance.yahoo.com']){
    try{const r=await fetch(`${h}/v8/finance/chart/${encodeURIComponent(sym)}?interval=1d&range=1d`);
      if(!r.ok)continue;const d=await r.json();
      const m=d&&d.chart&&d.chart.result&&d.chart.result[0]&&d.chart.result[0].meta;
      if(m&&m.regularMarketPrice!=null)return {price:+m.regularMarketPrice,cur:(m.currency||'EUR')};
    }catch(e){}
  }
  return null;
}
// Interroge d'abord la fonction Netlify (même origine, aucune limite CORS), sinon Yahoo en direct
async function quoteVia(sym){
  try{const r=await fetch('/.netlify/functions/quote?s='+encodeURIComponent(sym));
    if(r.ok){const d=await r.json();if(d&&d.price!=null)return {price:+d.price,cur:d.cur||'EUR'};}}catch(e){}
  return await yahooQuote(sym);
}
function toEUR(px,cur,fx){const c=(cur||'EUR').toUpperCase();
  if(c==='EUR')return px; if(c==='USD')return px*fx;
  if(c==='GBP')return px; if(c==='GBX'||c==='GBP5'||c==='GBp')return px/100; return px;}
async function refreshPrices(){
  toast('Actualisation des cours…');
  const rep=[];let n=0;let fx=DB.settings.eurusd||0.92;
  // taux EUR/USD via Yahoo (sinon on garde le dernier connu)
  const needFx=DB.assets.some(a=>a.type!=='Crypto'&&a.cur==='USD');
  if(needFx){const q=await quoteVia('EURUSD=X');if(q&&q.price)fx=1/q.price;}
  // 1) Crypto -> CoinGecko (sans clé)
  const cr=DB.assets.filter(a=>a.type==='Crypto'&&(a.src||'auto')!=='manuel');
  const ids=[...new Set(cr.map(a=>CG[(a.ticker||'').toUpperCase()]).filter(Boolean))];
  let cg=null;
  if(ids.length){try{const r=await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${ids.join(',')}&vs_currencies=eur`);if(r.ok)cg=await r.json();}catch(e){}}
  cr.forEach(a=>{const lp=liveAssetPair(a),lq=lp&&LIVE.quotes[lp];
    if(lq&&Date.now()-lq.t<120000){a.price=lq.px;n++;rep.push([a.name,1,'Kraken (direct)']);return;}
    const id=CG[(a.ticker||'').toUpperCase()];if(id&&cg&&cg[id]&&cg[id].eur){a.price=cg[id].eur;n++;rep.push([a.name,1,'CoinGecko']);}
    else rep.push([a.name,0,'crypto introuvable — ticker type BTC-EUR']);});
  // 2) Actions & ETF -> Yahoo (défaut, couvre Euronext) puis Twelve Data en secours
  const st=DB.assets.filter(a=>a.type!=='Crypto');
  for(const a of st){
    const src=a.src||'auto';
    if(src==='manuel'){rep.push([a.name,2,'cours manuel']);continue;}
    if(!a.ticker&&!a.ysym){rep.push([a.name,0,'pas de ticker']);continue;}
    let done=false;
    if(src==='auto'||src==='yahoo'){
      const sym=yahooSym(a);
      if(sym){const q=await quoteVia(sym);
        if(q){a.price=+toEUR(q.price,q.cur,fx).toFixed(4);n++;done=true;rep.push([a.name,1,'Yahoo '+sym+(q.cur&&q.cur.toUpperCase()!=='EUR'?' ('+q.cur+'→€)':'')]);}
      }
    }
    if(!done&&(src==='auto'||src==='twelvedata')&&DB.settings.stockKey){
      try{const r=await fetch(`https://api.twelvedata.com/price?symbol=${encodeURIComponent(a.ticker)}&apikey=${DB.settings.stockKey}`);const d=await r.json();
        const px=d&&d.price?+d.price:null;
        if(px!=null){a.price=a.cur==='USD'?+(px*fx).toFixed(4):px;n++;done=true;rep.push([a.name,1,'Twelve Data']);}
        else rep.push([a.name,0,'Yahoo KO + Twelve Data : '+(d&&d.message?d.message:'indisponible')]);
      }catch(e){rep.push([a.name,0,'indisponible (réseau/CORS)']);}
    } else if(!done){
      rep.push([a.name,0,src==='twelvedata'?'Twelve Data sans clé API':'cours indisponible (Yahoo bloqué ?)']);
    }
  }
  DB.settings.eurusd=fx;DB.settings.lastPriceReport={t:Date.now(),rep};
  save();renderAll();
  const okn=rep.filter(x=>x[1]===1).length,bad=rep.filter(x=>x[1]===0).length;
  if(okn)toast(okn+' cours à jour'+(bad?' · '+bad+' en échec (détail ⓘ)':''));
  else toast(bad?'Aucun cours — appuie sur ⓘ pour le détail':'Rien à actualiser',bad>0);
}

  const rows=r.rep.map(x=>`<div class="spread" style="padding:9px 0;border-bottom:1px solid var(--line)"><span style="font-size:13px">${x[1]===1?'✅':x[1]===2?'✋':'⚠️'} ${x[0]}</span><span style="font-size:11.5px;color:var(--ink3);text-align:right;max-width:55%">${x[2]}</span></div>`).join('');
  openSheet(`<div class="spread"><h2>Détail des cours</h2><button class="btn sm" onclick="closeSheet()">Fermer</button></div>
   ${liveReportHtml()}
   <div class="note">Dernière actualisation : ${new Date(r.t).toLocaleString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}.</div>
   ${rows}
   <div class="hint" style="margin-top:12px">✅ mis à jour · ✋ cours manuel · ⚠️ échec. Si un ETF Amundi échoue : ouvre-le ▸ Modifier, règle <b>Source = Yahoo</b> et vérifie le <b>symbole Yahoo</b> (ex. <code>CW8.PA</code>, <code>PE500.PA</code>, <code>PAEEM.PA</code>). Les cours Euronext ne sont pas couverts par le plan gratuit Twelve Data — Yahoo oui.</div>`);
}

const LIVE={ws:null,key:'',status:'off',quotes:{},bad:{},retry:0,timer:null,paint:null,persist:null,dirty:false,unsaved:false,lastDash:0};
function liveOn(){return DB.settings.liveCrypto!==false;}
function liveAssetPair(a){return a&&a.type==='Crypto'&&(a.src||'auto')!=='manuel'?Fin.krakenPair(a.ticker||''):null;}
function livePairs(){return [...new Set(DB.assets.map(liveAssetPair).filter(p=>p&&!LIVE.bad[p]))].sort();}
function liveSync(){
  const pairs=livePairs(),key=pairs.join(',');
  const want=liveOn()&&pairs.length>0&&document.visibilityState!=='hidden'&&typeof WebSocket==='function';
  if(!want){if(LIVE.ws||LIVE.timer)liveStop();LIVE.status=liveOn()?'off':'disabled';return;}
  if((LIVE.ws||LIVE.timer)&&LIVE.key===key)return;
  liveStop();LIVE.key=key;liveConnect(pairs);
}
function liveConnect(pairs){
  let ws;try{ws=new WebSocket(KRAKEN_WS);}catch(e){LIVE.status='error';return;}
  LIVE.ws=ws;LIVE.status='connecting';
  ws.onopen=()=>{if(LIVE.ws!==ws)return;LIVE.retry=0;LIVE.status='on';
    ws.send(JSON.stringify({method:'subscribe',params:{channel:'ticker',snapshot:true,symbol:pairs}}));livePaintSoon();};
  ws.onmessage=(ev)=>{if(LIVE.ws===ws)liveMessage(ev.data);};
  ws.onerror=()=>{};
  ws.onclose=()=>{if(LIVE.ws!==ws)return;LIVE.ws=null;
    if(liveOn()&&document.visibilityState!=='hidden'){const d=Math.min(60000,2000*2**LIVE.retry);LIVE.retry=Math.min(LIVE.retry+1,6);LIVE.status='retry';
      clearTimeout(LIVE.timer);LIVE.timer=setTimeout(()=>{LIVE.timer=null;LIVE.key='';liveSync();},d);}
    else LIVE.status='off';
    livePaintSoon();};
}
function liveStop(){clearTimeout(LIVE.timer);LIVE.timer=null;const ws=LIVE.ws;LIVE.ws=null;LIVE.key='';
  if(ws){try{ws.close();}catch(e){}}LIVE.status='off';livePersist();}
function liveMessage(raw){
  if(typeof raw!=='string'||raw.length>100000)return;
  let m;try{m=JSON.parse(raw);}catch(e){return;}
  if(!m||typeof m!=='object')return;
  if(m.method==='subscribe'&&m.success===false){ // paire inconnue de Kraken : on la retire du direct (CoinGecko prend le relais via ↻)
    const p=String(m.symbol||(m.result&&m.result.symbol)||'').toUpperCase(),q=(String(m.error||'').match(/[A-Z0-9]{2,10}\/EUR/)||[])[0];
    const bad=/^[A-Z0-9]{2,10}\/EUR$/.test(p)?p:q;if(bad&&!LIVE.bad[bad]){LIVE.bad[bad]=1;setTimeout(liveSync,0);}return;}
  if(m.channel!=='ticker'||!Array.isArray(m.data))return;
  const wanted=new Set(livePairs());let changed=false;
  for(const d of m.data.slice(0,50)){
    if(!d||typeof d.symbol!=='string'||!wanted.has(d.symbol))continue;
    const q=LIVE.quotes[d.symbol],px=Fin.acceptTick(q?q.px:null,d.last);if(px==null)continue;
    const chg=typeof d.change_pct==='number'&&Number.isFinite(d.change_pct)&&Math.abs(d.change_pct)<1000?d.change_pct:null;
    LIVE.quotes[d.symbol]={px,chg,t:Date.now()};
    DB.assets.forEach(a=>{if(liveAssetPair(a)===d.symbol&&a.price!==px){a.price=px;changed=true;}});
  }
  if(changed){LIVE.dirty=true;LIVE.unsaved=true;livePaintSoon();if(!LIVE.persist)LIVE.persist=setTimeout(livePersist,300000);}
}
// Enregistrement discret des derniers cours (au plus toutes les 5 min et à la mise en arrière-plan) :
// pas de modification de la date de mise à jour des données, donc pas de synchronisation Drive déclenchée.
function livePersist(){clearTimeout(LIVE.persist);LIVE.persist=null;if(!LIVE.unsaved)return;LIVE.unsaved=false;
  try{localStorage.setItem('investco_v1',JSON.stringify(Fin.serialize(DB)));}catch(e){}}
function livePaintSoon(){if(LIVE.paint)return;LIVE.paint=setTimeout(()=>{LIVE.paint=null;livePaint();},2500);}
function livePaint(){
  document.querySelectorAll('[data-live-badge]').forEach(el=>{el.innerHTML=liveBadgeHtml();});
  if(!LIVE.dirty||document.visibilityState==='hidden'||lockIsOn()||$('#ov').classList.contains('on'))return; // jamais sous une fenêtre ouverte
  const v=document.querySelector('.view.on'),id=v&&v.id,C=window.Chart&&Chart.defaults,an=C?Chart.defaults.animation:undefined;
  try{if(C)Chart.defaults.animation=false;
    if(id==='v-placements'&&placeTab==='bourse'){const tw=document.querySelector('#place-body .twrap'),sl=tw?tw.scrollLeft:0;
      renderPlacements();const tw2=document.querySelector('#place-body .twrap');if(tw2)tw2.scrollLeft=sl;LIVE.dirty=false;}
    else if(id==='v-dash'&&Date.now()-LIVE.lastDash>30000){renderDash();LIVE.lastDash=Date.now();LIVE.dirty=false;}
  }finally{if(C)Chart.defaults.animation=an;}
}
function liveBadgeHtml(){
  if(!liveOn()||!livePairs().length)return '';
  if(LIVE.status==='on')return '<span class="live-b on" title="Cours crypto en direct (Kraken)">● direct</span>';
  return '<span class="live-b" title="Connexion au flux Kraken">○ connexion…</span>';
}
function liveChg(a){const p=liveAssetPair(a),q=p&&LIVE.quotes[p];if(!q||q.chg==null||Date.now()-q.t>600000)return '';
  return ` · <span class="${q.chg>=0?'pos':'neg'}">${q.chg>=0?'+':''}${fin(r2(q.chg))} % 24 h</span>`;}
function liveReportHtml(){
  if(!liveOn())return '<div class="note">Cours crypto en direct désactivés (Réglages ▸ Avancé).</div>';
  const P=DB.assets.map(liveAssetPair).filter(Boolean);if(!P.length)return '';
  const st={on:'connecté',connecting:'connexion…',retry:'reconnexion…',off:'en pause',error:'indisponible'}[LIVE.status]||'en pause';
  const rows=[...new Set(P)].map(p=>{const q=LIVE.quotes[p];return `<div class="spread" style="padding:7px 0;border-bottom:1px solid var(--line);font-size:13px"><span>${LIVE.bad[p]?'⚠️':q?'⚡':'…'} ${esc(p)}</span><span style="font-size:11.5px;color:var(--ink3)">${LIVE.bad[p]?'non coté sur Kraken : CoinGecko via ↻':q?eur(q.px)+' · il y a '+Math.max(0,Math.round((Date.now()-q.t)/1000))+' s':'en attente'}</span></div>`;}).join('');
  return `<div class="note" style="margin-top:0">⚡ Crypto en direct (Kraken) : <b>${st}</b>.</div>${rows}`;
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')liveStop();else liveSync();});
window.addEventListener('pagehide',()=>livePersist());

function applyTheme(){document.documentElement.setAttribute('data-theme',DB.settings.theme||'dark');}
function enableNotif(){if(!('Notification' in window)){toast('Non supporté ici',true);return;}
  Notification.requestPermission().then(p=>{DB.settings.notif=(p==='granted');save();closeSheet();toast(DB.settings.notif?'Rappels activés':'Refusé');});}
function checkAlerts(){if(!DB.settings.notif||!('Notification'in window)||Notification.permission!=='granted')return;
  const msgs=alertsList().map(a=>a.txt);
  if(msgs.length){try{new Notification('Invest.co',{body:msgs.slice(0,3).join('\n'),icon:'icon-192.png'});}catch(e){}}}
function toggleTheme(){DB.settings.theme=(DB.settings.theme==='dark')?'light':'dark';applyTheme();save();renderAll();}
function nav(v){document.querySelectorAll('.view').forEach(x=>x.classList.remove('on'));$('#v-'+v).classList.add('on');
  document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('on',a.dataset.v===v));window.scrollTo(0,0);
  if(v==='dash'){dashAnimated=false;renderDash();}}
function autoSnapshot(){const now=today();const mk=ymKey(now);const last=DB.settings.lastSnapMonth;
  if(last&&last!==mk){DB.settings.snapshots[last]=DB.settings.snapshots[last]??Math.round(consolidate().net);}
  DB.settings.lastSnapMonth=mk;}
function renderAll(){renderDash();renderPlacements();renderBudget();renderRevente();try{liveSync();}catch(e){}}
function hideSplash(){setTimeout(()=>{const s=$('#splash');if(s){s.style.opacity='0';setTimeout(()=>s.remove(),400);}},550);}
function boot(){try{load();applyTheme();runRecurring();autoSnapshot();save();
  $('#asof').textContent='mis à jour le '+today().toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'});
  renderAll();maybeOnboard();checkAlerts();}finally{hideSplash();}
}
// ---- Verrouillage : code haché (PBKDF2) + empreinte / visage (WebAuthn), écran de protection (pas de chiffrement)
const LOCK_ITER=150000;let lockBuf='',lockHiddenAt=0;
const lk=()=>DB.settings.lock||{enabled:false};
const b64=(buf)=>btoa(String.fromCharCode(...new Uint8Array(buf))),unb64=(s)=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const randHex=(n)=>[...crypto.getRandomValues(new Uint8Array(n))].map(b=>b.toString(16).padStart(2,'0')).join('');
function lockIsOn(){return $('#lock').classList.contains('on');}
function lockNow(){if(!lk().enabled)return;lockBuf='';$('#lock').classList.add('on');lockDraw();
  const L=lk();$('#lk-bio').style.display=L.bio?'inline':'none';if(L.bio)setTimeout(()=>{if(lockIsOn())lockBio();},350);}
function lockDraw(msg){const n=lk().len||4;$('#lk-dots').innerHTML=Array.from({length:n},(_,k)=>`<i class="${k<lockBuf.length?'f':''}"></i>`).join('');
  if(msg!=null)$('#lk-msg').textContent=msg;
  if(!$('#lk-pad').children.length)$('#lk-pad').innerHTML=[1,2,3,4,5,6,7,8,9].map(d=>`<button onclick="lockKey('${d}')">${d}</button>`).join('')+`<button class="ghost" onclick="lockKey('C')">Effacer</button><button onclick="lockKey('0')">0</button><button class="ghost" onclick="lockKey('<')">⌫</button>`;}
function lockWait(){const u=+localStorage.getItem('investco_lock_until')||0;return Math.max(0,Math.ceil((u-Date.now())/1000));}
async function lockKey(k){const w=lockWait();if(w){lockDraw('Trop d\'essais : réessaie dans '+w+' s');return;}
  if(k==='C')lockBuf='';else if(k==='<')lockBuf=lockBuf.slice(0,-1);else if(lockBuf.length<(lk().len||4))lockBuf+=k;
  lockDraw('');if(lockBuf.length===(lk().len||4)){const L=lk(),h=await Fin.hashPin(lockBuf,L.salt,L.iter||LOCK_ITER);
    if(h===L.hash){localStorage.removeItem('investco_lock_fails');unlock();}
    else{const f=(+localStorage.getItem('investco_lock_fails')||0)+1;localStorage.setItem('investco_lock_fails',f);lockBuf='';
      $('#lock').classList.remove('shake');void $('#lock').offsetWidth;$('#lock').classList.add('shake');
      if(f>=5){localStorage.setItem('investco_lock_until',Date.now()+30000);localStorage.setItem('investco_lock_fails',0);lockDraw('Trop d\'essais : réessaie dans 30 s');}
      else lockDraw('Code incorrect');}}}
function unlock(){$('#lock').classList.remove('on');lockBuf='';}
async function lockBio(){const L=lk();if(!L.bio||!window.PublicKeyCredential)return;
  try{await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:[{type:'public-key',id:unb64(L.bio)}],userVerification:'required',timeout:60000}});unlock();}
  catch(e){lockDraw('Empreinte non reconnue : utilise ton code');}}
function lockForgot(){if(!confirm('Sans le code, la seule solution est d\'effacer toutes les données de l\'application sur cet appareil.\n\nTu pourras ensuite les restaurer depuis un export ou Google Drive.\n\nContinuer ?'))return;
  if(!confirm('Dernière confirmation : effacer toutes les données Invest.co de cet appareil ?'))return;
  ['investco_v1','patrimoine_v1',BAK_KEY,'investco_lock_fails','investco_lock_until'].forEach(k=>{try{localStorage.removeItem(k);}catch(e){}});location.reload();}
document.addEventListener('keydown',e=>{if(!lockIsOn())return;if(/^\d$/.test(e.key))lockKey(e.key);else if(e.key==='Backspace')lockKey('<');});
document.addEventListener('visibilitychange',()=>{if(!lk().enabled)return;
  if(document.visibilityState==='hidden')lockHiddenAt=Date.now();
  else if(lockHiddenAt&&!lockIsOn()&&Date.now()-lockHiddenAt>=(lk().delay||0)*1000)lockNow();});
// Réglages du verrouillage
function lockSettingsHtml(){const L=lk();
  return `<div class="field" style="border-top:1px solid var(--line);padding-top:14px"><label>🔒 Verrouillage</label>
    ${L.enabled?`<div class="row" style="gap:8px;flex-wrap:wrap"><select id="lk_delay" onchange="DB.settings.lock.delay=+this.value;save();toast('Délai enregistré')" style="flex:1;min-width:140px">${[[0,'Immédiat'],[60,'Après 1 min'],[300,'Après 5 min'],[900,'Après 15 min']].map(([v,l])=>`<option value="${v}" ${(L.delay||0)===v?'selected':''}>${l}</option>`).join('')}</select>
      <button class="btn sm" onclick="lockBioToggle()">${L.bio?'Désactiver l\'empreinte':'👆 Activer l\'empreinte'}</button><button class="btn sm" onclick="lockSetup(true)">Changer le code</button><button class="btn sm" style="color:var(--neg)" onclick="lockDisable()">Désactiver</button></div>
      <div class="hint">Code demandé à l'ouverture et au retour dans l'appli. C'est un écran de protection : tes données ne sont pas chiffrées.</div>`
    :`<button class="btn" style="width:100%" onclick="lockSetup(false)">Activer le verrouillage par code</button><div class="hint">Code à 4 à 6 chiffres, et empreinte ou visage si ton téléphone le permet.</div>`}</div>`;}
function lockSetup(change){openSheet(`<div class="spread"><h2>${change?'Changer le':'Choisir un'} code</h2><button class="btn sm" onclick="closeSheet();openSettings()">Retour</button></div>
   ${change?`<div class="field"><label>Code actuel</label><input type="password" inputmode="numeric" autocomplete="off" id="lk_old" maxlength="6"></div>`:''}
   <div class="field"><label>Nouveau code (4 à 6 chiffres)</label><input type="password" inputmode="numeric" autocomplete="off" id="lk_new" maxlength="6"></div>
   <div class="field"><label>Confirme le code</label><input type="password" inputmode="numeric" autocomplete="off" id="lk_new2" maxlength="6"></div>
   <div class="note" style="margin-top:6px">Retiens bien ce code : s'il est perdu, il faudra effacer les données et les restaurer depuis un export ou Google Drive.</div>
   <button class="btn primary" style="width:100%;margin-top:14px" onclick="lockSave(${change})">Enregistrer</button>`);}
async function lockCheck(pin){const L=lk();return L.enabled&&(await Fin.hashPin(pin,L.salt,L.iter||LOCK_ITER))===L.hash;}
async function lockSave(change){const a=$('#lk_new').value,b=$('#lk_new2').value;
  if(change&&!(await lockCheck($('#lk_old').value))){toast('Code actuel incorrect',true);return;}
  if(!/^\d{4,6}$/.test(a)){toast('Le code doit comporter 4 à 6 chiffres',true);return;}
  if(a!==b){toast('Les deux codes ne correspondent pas',true);return;}
  const salt=randHex(16),hash=await Fin.hashPin(a,salt,LOCK_ITER),old=lk();
  DB.settings.lock={enabled:true,salt,hash,iter:LOCK_ITER,len:a.length,delay:old.delay||0,bio:old.bio||null};save();closeSheet();openSettings();toast('Verrouillage activé');}
async function lockDisable(){const pin=prompt('Code actuel pour désactiver le verrouillage :');if(pin==null)return;
  if(!(await lockCheck(pin))){toast('Code incorrect',true);return;}DB.settings.lock={enabled:false};save();closeSheet();openSettings();toast('Verrouillage désactivé');}
async function lockBioToggle(){const L=lk();
  if(L.bio){DB.settings.lock.bio=null;save();closeSheet();openSettings();toast('Empreinte désactivée');return;}
  try{if(!window.PublicKeyCredential||!(await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable())){toast('Empreinte ou visage non disponible sur cet appareil',true);return;}
    const c=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:'Invest.co'},user:{id:crypto.getRandomValues(new Uint8Array(16)),name:'invest.co',displayName:'Invest.co'},
      pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'discouraged'},timeout:60000}});
    DB.settings.lock.bio=b64(c.rawId);save();closeSheet();openSettings();toast('Empreinte activée');}
  catch(e){toast('Activation annulée',true);}}
// ---- Mises à jour de l'appli
let swReg=null;
function showUpdate(){const b=$('#updbar');if(!b)return;b.className='updbar on';b.onclick=applyUpdate;}
function applyUpdate(){backupLocal('Avant mise à jour de l\'appli');
  if(swReg&&swReg.waiting)swReg.waiting.postMessage({type:'SKIP_WAITING'});else location.reload();}
async function checkUpdate(manual){
  if(!swReg){if(manual)toast('Vérification impossible (hors ligne ?)',true);return;}
  try{await swReg.update();}catch(e){if(manual)toast('Vérification impossible (hors ligne ?)',true);return;}
  if(swReg.waiting){showUpdate();if(manual)toast('Nouvelle version prête : touche la barre orange');}
  else if(manual)toast(swReg.installing?'Téléchargement de la nouvelle version…':'Tu as la dernière version ('+APP_V+')');}
// « Nouveautés » : affiché une fois après chaque mise à jour
function whatsNew(force){let seen=null;try{seen=localStorage.getItem('investco_seen_version');}catch(e){}
  if(!force&&(seen===APP_V||isFresh)){try{localStorage.setItem('investco_seen_version',APP_V);}catch(e){}return;}
  const r=self.APP_RELEASE||{notes:[]};
  openSheet(`<div class="spread"><h2>Nouveautés de la version ${esc(APP_V)}</h2><button class="btn sm" onclick="closeSheet()">Fermer</button></div>
    <ul style="margin:12px 0 0 18px;line-height:1.55;font-size:13.5px;color:var(--ink2)">${r.notes.map(n=>`<li style="margin-bottom:6px">${esc(n)}</li>`).join('')}</ul>
    <div class="hint" style="margin-top:10px">Une copie de tes données a été faite avant la mise à jour (Réglages ▸ Sauvegardes de sécurité).</div>`);
  try{localStorage.setItem('investco_seen_version',APP_V);}catch(e){}}
// Le service worker est enregistré AVANT le démarrage : même si un écran plante, les mises à jour restent possibles
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>{swReg=reg;
      // Une mise à jour déjà téléchargée et en attente : on la propose tout de suite
      if(reg.waiting&&navigator.serviceWorker.controller)showUpdate();
      reg.addEventListener('updatefound',()=>{const nw=reg.installing;if(!nw)return;
        nw.addEventListener('statechange',()=>{if(nw.state==='installed'&&navigator.serviceWorker.controller)showUpdate();});});
      // Vérifie aussi au retour dans l'appli et toutes les 30 minutes
      document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkUpdate(false);});
      setInterval(()=>checkUpdate(false),30*60*1000);
    }).catch(()=>{});
    // Rechargement seulement quand une nouvelle version remplace l'ancienne (pas à la toute première installation)
    const hadCtrl=!!navigator.serviceWorker.controller;
    let refreshing;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(refreshing||!hadCtrl)return;refreshing=true;location.reload();});
  });
}
try{boot();}catch(e){console.error(e);toast('Erreur au démarrage : '+e.message,true);}
try{lockNow();}catch(e){}
setTimeout(()=>{try{whatsNew(false);}catch(e){}},900);
</script>
