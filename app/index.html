:root[data-theme="light"]{

}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;

.wrap{max-width:1000px;margin:0 auto;padding:16px}
h1{font-size:20px;font-weight:650}h2{font-size:15px;font-weight:600}
.muted{color:var(--ink2)}.mut3{color:var(--ink3)}.sub{font-size:12.5px;color:var(--ink3)}
.pos{color:var(--pos)}.neg{color:var(--neg)}

.brandmark{width:34px;height:34px;border-radius:50%;background:var(--hero);display:flex;align-items:center;justify-content:center}
.btn{font:inherit;font-size:13px;font-weight:550;color:var(--ink);background:var(--card);
  border:1px solid var(--line2);border-radius:10px;padding:7px 12px;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;transition:.12s;-webkit-tap-highlight-color:transparent}
.btn:hover{border-color:var(--ink3)}.btn:active{transform:scale(.97)}

.two{display:grid;grid-template-columns:1fr 1fr;gap:11px}

.codebox:active{opacity:.6}

.empty{text-align:center;padding:34px 20px;color:var(--ink3);font-size:13.5px}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);z-index:80;background:var(--orange);color:#fff;
  font-size:13px;font-weight:600;padding:10px 16px;border-radius:12px;opacity:0;transition:.25s;pointer-events:none;max-width:90%}
.toast.on{opacity:1}.toast.err{background:var(--neg)}
.note{font-size:12px;color:var(--ink3);line-height:1.6;margin-top:8px}
.view{display:none}.view.on{display:block;animation:fadeIn .25s ease}
.addbtn{width:100%;border:1.5px dashed var(--line2);background:transparent;color:var(--ink2);
  border-radius:12px;padding:12px;font:inherit;font-weight:600;font-size:13.5px;cursor:pointer;transition:.15s}
.addbtn:hover{border-color:var(--orange);color:var(--orange)}
.subtabs{display:flex;gap:6px;margin:16px 0 4px}
.subtab{flex:1;text-align:center;padding:9px;border-radius:10px;font-size:13px;font-weight:600;color:var(--ink2);background:var(--card);border:1px solid var(--line);cursor:pointer;transition:.15s}
.subtab.on{color:var(--orange);border-color:var(--orange);background:var(--orange-soft)}
.live-b{white-space:nowrap;font-size:11px;font-weight:600;color:var(--ink3);margin-left:6px;vertical-align:middle;font-family:inherit}.live-b.on{color:var(--pos)}
.hq{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--ink3);background:transparent;color:var(--ink2);font:700 11px/1 'Inter',sans-serif;cursor:pointer;margin-left:5px;vertical-align:middle;padding:0;flex:none;text-transform:none;letter-spacing:0}
.hq:hover,.hq:focus-visible{border-color:var(--orange);color:var(--orange);outline:none}
#hlp{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center}
#hlp.on{display:flex}
#hlp .hlp-card{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:20px 20px calc(22px + env(safe-area-inset-bottom,0));max-height:80vh;overflow-y:auto;animation:slideUp .22s ease}
#hlp .hlp-b{font-size:13.5px;line-height:1.65;color:var(--ink2);margin-top:8px}#hlp .hlp-b b{color:var(--ink)}#hlp .hlp-b ul{margin:6px 0 6px 18px}#hlp .hlp-b p{margin:6px 0}
@media(min-width:640px){#hlp{align-items:center}#hlp .hlp-card{border-radius:18px}}
.hero2{background:var(--hero);border-radius:18px;padding:18px;margin-top:16px}.hero2 .k-l{color:#9fb0c2}
.hero2 .big{font-family:'Space Grotesk';font-weight:700;font-size:34px;color:#fff;letter-spacing:-.02em;margin-top:2px}
.hero2 .hl1{font-size:13.5px;color:#c9d4df;margin-top:6px}.hero2 .hl2{font-size:12.5px;color:#8a9bb0;margin-top:2px}.hero2 .hl3{font-size:11.5px;color:#6f8297;margin-top:8px}
.hero2 .pos{color:var(--pos)}.hero2 .neg{color:var(--neg)}
.kpis.k3 .k-v{font-size:17px;color:var(--ink)}.kpis.k3 .k-v.neg{color:var(--neg)}.kpis.k3 .kpi.hero .k-v{color:#fff}.kpis.k3 .u{font-size:11px;font-weight:500}.kpis.k3 .k-s{font-size:10.5px;line-height:1.35}
.kpis.k3 .v2{font-family:'Space Grotesk';font-weight:650;font-size:15px;margin-top:3px}
.al{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line);font-size:13px}.al:first-of-type{margin-top:6px}
button.chip{cursor:pointer;font-family:inherit}
.fv{font-family:'Space Grotesk';font-weight:650;font-size:18px;color:var(--ink);white-space:nowrap;text-align:right}
.tot{font-family:'Space Grotesk';font-weight:700;font-size:24px;color:var(--ink)}
.grp{display:flex;justify-content:space-between;align-items:center;margin:16px 2px 8px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.grp b{font-family:'Space Grotesk';letter-spacing:0;text-transform:none;color:var(--ink);font-size:14px}.grp .hq{text-transform:none}
.gsub{font-size:11.5px;color:var(--ink3);margin:-4px 2px 8px;line-height:1.5}.lnk{color:var(--orange);cursor:pointer}

.chip{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--card2);color:var(--ink2);border:1px solid var(--line2);white-space:nowrap}
.chip.ok{background:rgba(61,209,160,.12);color:var(--pos);border-color:rgba(61,209,160,.35)}.chip.warn{background:rgba(247,147,26,.13);color:var(--orange);border-color:rgba(247,147,26,.4)}.chip.neg{background:rgba(232,108,100,.12);color:var(--neg);border-color:rgba(232,108,100,.35)}
.kpis.k3{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.kpis.k3 .kpi{padding:11px 11px}.kpis.k3 .k-l{font-size:11px}
.g2k{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-top:12px}.g2k b{font-family:'Space Grotesk';font-size:15px}
.lst .li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:13px;cursor:pointer}

.switch span{position:absolute;inset:0;border-radius:12px;background:var(--line2);transition:.2s;cursor:pointer}.switch span:after{content:'';position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}

.pill-status{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px}
canvas{max-width:100%}
.count{transition:none}
#splash{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .4s ease}

function refPrice(a,y){const r=(DB.refPrices||[]).find(x=>x.y===y&&x.name===a.name);return r?+r.px:null;}
function qtyAt(a,R){let q=0;DB.movements.forEach(m=>{if(m.p!==a.name||!(String(m.d)<R))return;const qq=m.q!=null?+m.q:((m.m!=null&&m.pu)?m.m/m.pu:0);if(m.t==='Achat')q+=qq;else if(m.t==='Vente')q=Math.max(0,q-qq);});return q;}
function costAt(a,R){const mv=DB.movements.filter(m=>m.p===a.name&&String(m.d)<R).slice().sort((x,y)=>x.d<y.d?-1:1);let cost=0,qty=0;
  mv.forEach(m=>{const g=(m.q!=null&&m.pu!=null)?m.q*m.pu:(m.m!=null?m.m:0),q=m.q!=null?m.q:((m.m!=null&&m.pu)?m.m/m.pu:0);
    if(m.t==='Achat'){cost+=g+(m.f||0);qty+=q;}else if(m.t==='Vente'){const u=qty?cost/qty:0,qs=Math.min(q,qty);cost-=u*qs;qty-=qs;}});return Math.max(0,cost);}
function yearRef(y){const R=y+'-01-01',eve=ymd(new Date(y-1,11,31)),man=(DB.settings.refManual||{})[y];
  let sav=0,ast=0,crowd=0,re=0,debt=0,approx=[];
  DB.savings.forEach(s=>{DB.movements.forEach(m=>{const e=movEffect(m,s.name);if(!e)return;if(String(m.d)<R||m.t==='Reprise')sav+=e;});
    if(s.type==='Compte courant')sav-=(DB.expenses||[]).filter(e=>String(e.d)<R).reduce((a,e)=>a+(+e.amt||0),0);});
  DB.assets.forEach(a=>{const q=qtyAt(a,R);if(q<=1e-12)return;const px=refPrice(a,y);if(px!=null)ast+=q*px;else{ast+=costAt(a,R);approx.push(a.name);}});
  const P=DB.pea||{};if((P.versements||[]).length){const ops=peaOps().filter(m=>String(m.d)<R),st=Fin.peaStatus({open:P.open,bank:P.bank,versements:P.versements.filter(v=>String(v.d)<R)},ops,param('ceil.PEA')||0,eve);if(st.real&&st.cash>0)ast+=st.cash;}
  DB.crowd.forEach(c=>{if(!(String(c.sub)<R))return;const cap=crowdLink(c,'cap');if(c.st==='Remboursé'&&(cap?String(cap.d)<R:ymd(addMonths(c.sub,c.dur||0))<R))return;crowd+=Fin.crowdCapitalAt(c,eve);});
  (DB.properties||[]).forEach(p=>{if(p.buyD&&!(p.buyD<R))return;re+=Fin.propertyValue(p,eve);});
  (DB.loans||[]).forEach(l=>{if(!(String(l.start)<R))return;debt+=Fin.loanStatus(l,eve).crd;});
  const auto=r2(sav+ast+crowd+re-debt);
  return {date:R,auto,value:man!=null?+man:auto,manual:man!=null,approx};}
function consolidate(){
  let bI=0,bV=0;DB.assets.forEach(a=>{const c=assetCalc(a);bI+=c.inv;bV+=c.value;});
  let iI=0,iV=0;DB.crowd.filter(crowdActive).forEach(c=>{const k=crowdCalc(c).capital;iI+=k;iV+=k;});
  let sI=0,sV=0,sN=0,dispo=0;DB.savings.forEach(s=>{const c=savingCalc(s);sI+=c.versed;sV+=(s.cap||0);sN+=c.net;if(c.cat!=='Assurance-vie')dispo+=(s.cap||0);});
  const RE=realEstate();const PEA=peaCalc(),peaCash=PEA.real&&PEA.cash>0?PEA.cash:0;
  bI+=peaCash;bV+=peaCash;
  const invested=bI+iI+sI+RE.cost,value=bV+iV+sV+RE.value,net=r2(value-RE.debt); // patrimoine net = actifs − capital restant dû
  const immoMonthly=DB.crowd.filter(c=>c.st==='En cours').reduce((a,c)=>{const k=crowdCalc(c);return a+(k.next?k.monthly:0)*(1-crowdTaxRate());},0);
  const y=today().getFullYear(),jan=new Date(y,0,1);let apports=0;
  DB.movements.forEach(m=>{if(new Date(m.d)>=jan){if(m.link||m.t==='Reprise'||m.t==='Transfert'||m.t==='Intérêts'||m.t==='Ajustement'||m.t==='Dividende')return;const g=(m.q!=null&&m.pu!=null)?m.q*m.pu:(m.m||0);const amt=g+(m.f||0);if(m.t==='Achat'||m.t==='Dépôt')apports+=amt;else apports-=amt;}});
  DB.crowd.forEach(c=>{if(new Date(c.sub)>=jan&&!crowdLink(c,'sub'))apports+=c.amt;}); // projet payé depuis le portefeuille : pas d'argent nouveau
  apports+=RE.principalYTD; // le capital de crédit déjà remboursé cette année est un effort d'épargne, pas un gain
  // bien acheté cette année : l'apport personnel (coût − emprunt) est de l'argent investi, pas un gain
  (DB.properties||[]).forEach(p=>{if(p.buyD&&pd(p.buyD)>=jan){const L=loansOf(p.id).filter(l=>pd(l.start)>=jan).reduce((a,l)=>a+(+l.capital||0),0);apports+=Math.max(0,Fin.propertyCost(p)-L);}});
  // Dépenses du compte courant : l'argent dépensé sort du patrimoine (ce n'est pas une perte de placement),
  // et un virement vers une plateforme réapparaît dans l'actif acheté (déjà compté en apport) : on retire donc toutes les dépenses.
  // Épargne versée = revenus et versements extérieurs − dépenses.
  DB.expenses.forEach(e=>{if(pd(e.d)>=jan)apports-=(+e.amt||0);});
  const R=yearRef(y),snap=R.value;const yearGain=snap!=null?r2(net-snap-apports):null;
  const yearPerf=(snap!=null&&(snap+apports)>0)?yearGain/(snap+apports):null;
  return {ref:R,invested,value,net,debt:RE.debt,reValue:RE.value,reCashflow:RE.cashflow,pv:value-invested,pvp:invested?(value-invested)/invested:0,bI,bV,iI,iV,sI,sV,sN,dispo,immoMonthly,apports,snap,yearGain,yearPerf};
}
function repartition(){const g=k=>DB.assets.filter(a=>a.type===k);const sum=(a,f)=>a.reduce((x,y)=>x+f(y),0);
  const A=g('Action'),E=g('ETF'),C=g('Crypto'),cf=DB.crowd.filter(crowdActive);
  const sav=cat=>DB.savings.filter(s=>savingCalc(s).cat===cat);
  const rows=[['Actions',sum(A,a=>assetCalc(a).inv),sum(A,a=>assetCalc(a).value)],
    ['ETF',sum(E,a=>assetCalc(a).inv),sum(E,a=>assetCalc(a).value)],
    ['Crypto',sum(C,a=>assetCalc(a).inv),sum(C,a=>assetCalc(a).value)],
    ['Crowdfunding immobilier',sum(cf,c=>crowdCalc(c).capital),sum(cf,c=>crowdCalc(c).capital)],
    ['Immobilier',sum(DB.properties||[],p=>Fin.propertyCost(p)),sum(DB.properties||[],p=>Fin.propertyValue(p,ymd(today())))],
    ['Épargne réglementée',sum(sav('Épargne réglementée'),s=>savingCalc(s).versed),sum(sav('Épargne réglementée'),s=>s.cap||0)],
    ['Assurance-vie',sum(sav('Assurance-vie'),s=>savingCalc(s).versed),sum(sav('Assurance-vie'),s=>s.cap||0)],
    ['Liquidités',sum(sav('Liquidités'),s=>savingCalc(s).versed)+(peaCalc().real?Math.max(0,peaCalc().cash):0),sum(sav('Liquidités'),s=>s.cap||0)+(peaCalc().real?Math.max(0,peaCalc().cash):0)]];
  const tot=rows.reduce((a,r)=>a+r[2],0)||1;
  return rows.map(r=>({name:r[0],inv:r[1],val:r[2],pv:r[2]-r[1],part:r[2]/tot}));
}

// ---- Plus-values crypto (article 150 VH bis) : calcul sur l'ensemble du portefeuille crypto, cession par cession
// Valeur globale du portefeuille à chaque vente : saisie sur la vente, sinon estimée (quantités détenues × prix de la
// vente pour la crypto vendue, dernier cours connu pour les autres).
function cryptoOps(){const C=DB.assets.filter(a=>a.type==='Crypto'&&a.env!=='PEA'),names=new Set(C.map(a=>a.name)),ops=[];
  DB.movements.filter(m=>names.has(m.p)&&(m.t==='Achat'||m.t==='Vente')).forEach(m=>{const g=(m.q!=null&&m.pu!=null)?m.q*m.pu:(+m.m||0);
    if(m.t==='Achat')ops.push({d:String(m.d).slice(0,10),t:'Achat',cost:r2(g+(+m.f||0))});
    else ops.push({d:String(m.d).slice(0,10),t:'Vente',price:r2(g),fees:+m.f||0,vg:m.vg!=null?+m.vg:cryptoVgEstimate(m)});});
  return ops;}
function cryptoVgEstimate(m){const d=String(m.d).slice(0,10);let v=0;
  DB.assets.filter(a=>a.type==='Crypto'&&a.env!=='PEA').forEach(a=>{let q=0;DB.movements.forEach(x=>{if(x.p!==a.name||x===m)return;const xd=String(x.d).slice(0,10);if(xd>d)return;const qq=x.q!=null?+x.q:((x.m!=null&&x.pu)?x.m/x.pu:0);if(x.t==='Achat')q+=qq;else if(x.t==='Vente'&&(xd<d))q=Math.max(0,q-qq);});
    const px=a.name===m.p&&m.pu?+m.pu:(+a.price||0);v+=q*px;});
  return r2(v);}
function cryptoTaxYear(y){return Fin.cryptoTax(cryptoOps(),y,param('crypto.seuil.cessions')||0);}
function fiscalData(){
  const y=today().getFullYear(),jan=new Date(y,0,1);
  let pelInt=0,pelName='',livretBancaireInt=0,celInt=0,hasExo=false;
  DB.savings.forEach(s=>{
    if(['Livret A','LDDS','LEP','Livret Jeune'].includes(s.type))hasExo=true;
    if(s.type==='PEL'){const oy=s.open?new Date(s.open).getFullYear():y;const age=s.open?monthsBetween(s.open,today())/12:0;
      if(oy>=2018||age>=12){pelInt+=savingCalc(s).brut;pelName=s.name;}}
    else if(s.type==='Livret bancaire')livretBancaireInt+=savingCalc(s).brut;
    else if(s.type==='CEL'){const oy=s.open?new Date(s.open).getFullYear():y;if(oy>=2018)celInt+=savingCalc(s).brut;}
  });
  let bricks=0;DB.crowd.forEach(c=>{bricks+=crowdYearInterest(c,y);});bricks=r2(bricks);
  const interestsTotal=pelInt+livretBancaireInt+celInt+bricks;
  let pvStock=0,pvCrypto=0;
  // Plus-values réalisées de l'année, calculées au PRU du moment de chaque vente
  DB.assets.forEach(a=>{if(a.env==='PEA'||a.type==='Crypto')return; // ventes dans le PEA non imposées tant que le plan reste ouvert ; crypto : formule à part
    assetCalc(a).realized.filter(r=>pd(r.d).getFullYear()===y).forEach(r=>{pvStock+=r.pv;});});
  const CX=cryptoTaxYear(y);pvCrypto=CX.taxable;
  let revRevenue=0,revCount=0;DB.resale.forEach(r=>{if(r.st==='Vendu'&&r.sellD&&new Date(r.sellD)>=jan){revRevenue+=r.sell||0;revCount++;}});
  const revBase=Fin.resaleYear(DB.resale,y,{regime:DB.settings.resaleRegime,abattement:param('revente.microbic.abattement')}).taxable;
  let avRachat=0,avTaxable=0,avAbat=0,avOver8=false;
  DB.savings.filter(s=>s.type==='Assurance-vie').forEach(s=>{
    const rachat=DB.movements.filter(m=>m.t==='Retrait'&&m.p===s.name&&new Date(m.d)>=jan).reduce((a,m)=>a+(m.m||0),0);
    if(rachat>0){avRachat+=rachat;const sc=savingCalc(s);const base=(s.cap||0)+rachat;const ratio=base>0?Math.max(0,sc.gains)/base:0;let g=rachat*ratio;
      const o8=s.open&&monthsBetween(s.open,today())>=96;if(o8){avOver8=true;const ab=param('tax.av.abattement')||0;avAbat+=Math.min(g,ab);g=Math.max(0,g-ab);}avTaxable+=g;}
  });
  let avNext=null;DB.savings.filter(s=>s.type==='Assurance-vie'&&s.open).forEach(s=>{const yr=new Date(s.open).getFullYear()+8;if(avNext==null||yr<avNext)avNext=yr;});
  const rate=taxBareme();
  const totalTaxable=interestsTotal+Math.max(0,pvStock)+Math.max(0,pvCrypto)+revBase+avTaxable;
  return {cx:CX,y,pelInt,pelName,celInt,livretBancaireInt,bricks,interestsTotal,hasExo,pvStock,pvCrypto,revRevenue,revCount,revBase,avRachat,avTaxable,avAbat,avOver8,avNext,rate,totalTaxable,estTax:totalTaxable*rate};
}

  const pv=Math.max(0,f.pvStock)+Math.max(0,f.pvCrypto);

  else{if(f.pvStock>0)bL.push(`Vous avez réalisé ${eur0(f.pvStock)} de plus-value en bourse.`);if(f.pvCrypto>0)bL.push(`Crypto : ${eur0(f.cx.cessions)} de ventes, ${eur0(f.pvCrypto)} de plus-value imposable (calcul officiel sur l'ensemble de votre portefeuille crypto, formulaire 2086).`);}
  if(f.cx.lines.length&&f.cx.exempt)bL.push(`Crypto : ${eur0(f.cx.cessions)} de ventes cette année, sous le seuil de ${eur0(param('crypto.seuil.cessions'))} : plus-value non imposable.`);
  {const dv=DB.assets.filter(a=>a.env!=='PEA').reduce((t,a)=>t+assetCalc(a).divsY,0),dp=DB.assets.filter(a=>a.env==='PEA').reduce((t,a)=>t+assetCalc(a).divsY,0);
   if(dv>0)bL.push(`Dividendes perçus hors PEA : ${eur0(dv)}. Ils sont en principe déjà imposés à la source et figurent sur votre déclaration préremplie : vérifiez-les.`);
   if(dp>0)bL.push(`Dividendes perçus dans votre PEA : ${eur0(dp)}, non imposables tant qu'ils restent dans le plan.`);}
  S.push({t:"Vos gains en bourse et crypto",a:pv,pos:pv<=0,lines:bL,c:pv>0?"Bourse en case 3VG, crypto via le formulaire 2086.":"Le jour où vous vendez : bourse case 3VG, crypto formulaire 2086."});
  // Revente
  let rL=[];if(f.revCount===0)rL.push("Vous n'avez rien revendu cette année.");
  else{rL.push(`Vous avez revendu pour ${eur0(f.revRevenue)} (${f.revCount} article${f.revCount>1?'s':''}).`);
    if(DB.settings.resaleRegime==='microbic')rL.push(`Activité d'achat-revente (micro-BIC) : après l'abattement de ${fin(r2(param('revente.microbic.abattement')*100))} %, il reste ${eur0(f.revBase)} imposables.`);
    else rL.push("Ventes occasionnelles de vos objets personnels : non imposables (sauf objet vendu plus de 5 000 €, bijoux et objets d'art). Si vous achetez pour revendre, choisissez « Activité d'achat-revente » dans Réglages.");}
  S.push({t:"Votre revente d'objets",a:f.revBase,pos:f.revCount===0||f.revBase===0,lines:rL,c:f.revBase>0?"À déclarer dans les revenus industriels et commerciaux (micro-BIC, ventes de marchandises) de votre déclaration de revenus.":""});
  // AV
  let aL=[];if(f.avRachat<=0){aL.push("Vous n'avez pas retiré d'argent cette année, donc rien à déclarer.");
    if(f.avOver8)aL.push("Bon à savoir : vous pouvez retirer jusqu'à 4 600 € de gains par an sans impôt.");
    else if(f.avNext)aL.push(`Bon à savoir : à partir de ${f.avNext}, vous pourrez retirer jusqu'à 4 600 € de gains par an sans impôt.`);}
  else{aL.push(`Vous avez retiré ${eur0(f.avRachat)}, dont ${eur0(f.avTaxable)} de gains imposables${f.avAbat>0?` (après ${eur0(f.avAbat)} d'abattement)`:''}.`);}
  S.push({t:"Votre assurance-vie",a:f.avTaxable,pos:f.avRachat<=0,lines:aL,c:""});
  return S;
}

function genFiscalPdf(){
  if(!window.jspdf){toast('Librairie PDF indisponible hors-ligne',true);return;}
  const f=fiscalData(),S=fiscSections(f);const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:'mm',format:'a4'});
  const NAVY=[11,20,32],OR=[247,147,26],INK=[26,38,52],MUT=[95,113,131],LINE=[230,235,241],SOFT=[246,248,251],GREEN=[15,122,77];
  const M=18,W=210,cw=W-2*M;let y=20;
  doc.setFont('helvetica','bold');doc.setFontSize(22);doc.setTextColor(...NAVY);doc.text('Relevé fiscal '+f.y,M,y);
  doc.setFontSize(14);const bx=W-M;doc.setTextColor(...NAVY);doc.text('Invest',bx-doc.getTextWidth('.co')-doc.getTextWidth('Invest'),y,{align:'left'});
  doc.setTextColor(...OR);doc.text('.co',bx-doc.getTextWidth('.co'),y,{align:'left'});
  y+=4;doc.setDrawColor(...OR);doc.setFillColor(...OR);doc.rect(M,y,cw,1.1,'F');
  y+=7;doc.setFont('helvetica','normal');doc.setFontSize(9.5);doc.setTextColor(...MUT);
  doc.text(doc.splitTextToSize("Ce que vos placements vous ont rapporté cette année, et ce qu'il faut déclarer. Édité le "+today().toLocaleDateString('fr-FR')+".",cw),M,y);
  y+=11;
  doc.setFillColor(...SOFT);doc.setDrawColor(...LINE);doc.roundedRect(M,y,cw,24,2,2,'FD');
  doc.setFontSize(8.5);doc.setTextColor(...MUT);doc.setFont('helvetica','bold');doc.text('À DÉCLARER CETTE ANNÉE',M+6,y+7);
  doc.setFontSize(16);doc.setTextColor(...NAVY);doc.text(f.totalTaxable>0?('Environ '+eur0(f.totalTaxable)+' de revenus'):'Rien à déclarer cette année',M+6,y+15);
  if(f.totalTaxable>0){doc.setFontSize(9.5);doc.setFont('helvetica','normal');doc.setTextColor(...INK);doc.text('Impôt estimé : '+eur0(f.estTax)+' (prélèvements sociaux)',M+6,y+21);}
  y+=30;
  S.forEach(s=>{
    const lines=doc.splitTextToSize(s.lines.join(' '),cw-40);const caseH=s.c?5:0;
    const bh=12+lines.length*4.6+caseH;
    if(y+bh>280){doc.addPage();y=20;}
    doc.setFillColor(...SOFT);doc.setDrawColor(...LINE);doc.roundedRect(M,y,cw,bh,2,2,'FD');
    doc.setFont('helvetica','bold');doc.setFontSize(11.5);doc.setTextColor(...NAVY);doc.text(s.t,M+5,y+7.5);
    doc.setFontSize(15);doc.setTextColor(...(s.pos?GREEN:NAVY));doc.text(eur0(s.a),W-M-5,y+9,{align:'right'});
    doc.setFont('helvetica','normal');doc.setFontSize(9.3);doc.setTextColor(...INK);doc.text(lines,M+5,y+13.5);
    if(s.c){doc.setFontSize(8);doc.setTextColor(...MUT);doc.text(doc.splitTextToSize(s.c,cw-10),M+5,y+13.5+lines.length*4.6);}
    y+=bh+5;
  });
  if(y+16>285){doc.addPage();y=20;}
  doc.setDrawColor(...LINE);doc.line(M,y,W-M,y);y+=5;
  doc.setFontSize(8);doc.setTextColor(...MUT);
  doc.text(doc.splitTextToSize("Ce relevé vous aide à y voir clair mais reste indicatif : avant de déclarer, vérifiez les montants avec les documents officiels de votre banque (IFU) ou demandez à un professionnel.",cw),M,y);
  doc.save('releve-fiscal-'+f.y+'.pdf');
  DB.settings.lastBackup=DB.settings.lastBackup;save();toast('Relevé téléchargé');
}

// Périmètre de la performance : placements financiers (bourse, crypto, épargne hors compte courant, crowdfunding).
// Le compte courant, l'immobilier et les crédits sont exclus ; l'argent qui entre ou sort de ce périmètre est un flux.
function finValue(){const cc=compteCourant(),c=consolidate();return r2(c.bV+c.iV+c.sV-(cc?(+cc.cap||0):0));}
function cashFlows(){
  const cf=[],cc=compteCourant(),ccn=cc?cc.name:'\u0000';
  DB.movements.forEach(m=>{
    if(m.link||m.t==='Intérêts'||m.t==='Ajustement'||m.t==='Dividende')return;
    if(m.p===ccn&&m.t!=='Transfert')return; // compte courant hors périmètre
    if(m.t==='Transfert'){const v=+m.m||0,d=new Date(m.d);if(!v||isNaN(d))return;if(m.p===ccn&&m.p2!==ccn)cf.push({d,a:-v});else if(m.p2===ccn&&m.p!==ccn)cf.push({d,a:+v});return;}
    const g=(m.q!=null&&m.pu!=null&&m.q!==''&&m.pu!=='')?(+m.q)*(+m.pu):(+m.m||0);
    const amt=g+(+m.f||0); if(!amt)return;
    const d=new Date(m.d); if(isNaN(d))return;
    if(m.t==='Achat'||m.t==='Dépôt'||m.t==='Reprise')cf.push({d,a:-amt}); else cf.push({d,a:+amt});
  });
  DB.crowd.forEach(c=>{if(c.sub&&!crowdLink(c,'sub')){const d=new Date(c.sub);if(!isNaN(d))cf.push({d,a:-(+c.amt||0)});}});
  return cf.sort((a,b)=>a.d-b.d);
}
function xirr(flows,finalVal){
  const cf=flows.slice(); cf.push({d:today(),a:finalVal});
  if(cf.length<2)return null;
  if(!cf.some(x=>x.a<0)||!cf.some(x=>x.a>0))return null;
  const t0=cf[0].d, yrs=x=>(x.d-t0)/(365.25*86400000);
  const npv=r=>cf.reduce((s,x)=>s+x.a/Math.pow(1+r,yrs(x)),0);
  let lo=-0.9999,hi=10,flo=npv(lo),fhi=npv(hi);
  if(flo*fhi>0){hi=100;fhi=npv(hi);if(flo*fhi>0)return null;}
  for(let i=0;i<200;i++){const mid=(lo+hi)/2,fm=npv(mid);if(Math.abs(fm)<1e-4||(hi-lo)<1e-10)return mid;if(flo*fm<0){hi=mid;}else{lo=mid;flo=fm;}}
  return (lo+hi)/2;
}
function monthlySeries(){
  const snaps=DB.settings.snapFin||{},map={};
  Object.keys(snaps).forEach(k=>{if(snaps[k]==null)return;map[k]=+snaps[k];});
  const curM=ymKey(today()); map[curM]=Math.round(finValue());
  return Object.keys(map).sort().map(m=>({m,v:map[m]}));
}
function flowByMonth(){const f={};cashFlows().forEach(x=>{const k=ymKey(x.d);f[k]=(f[k]||0)+(-x.a);});return f;}
function twrSeries(){
  const ser=monthlySeries(); if(ser.length<2)return null;
  const fm=flowByMonth(); let idx=100; const out=[{m:ser[0].m,base:100}];
  for(let i=1;i<ser.length;i++){const v0=ser[i-1].v,v1=ser[i].v,flow=fm[ser[i].m]||0;
    if(v0>0){const hpr=(v1-flow)/v0; if(hpr>0&&isFinite(hpr))idx*=hpr;} out.push({m:ser[i].m,base:+idx.toFixed(2)});}
  return out;
}
function perfStats(){
  const val=finValue(), flows=cashFlows();
  const t0=flows.length?flows[0].d:null,days=t0?(today()-t0)/86400000:0;
  // pas de chiffre avant 3 mois de recul ; en dessous d'un an, rendement sur la période plutôt qu'annualisé
  let irr=days>=90?xirr(flows,val):null;const irrPeriod=irr!=null&&days<365?Math.pow(1+irr,days/365)-1:null;
  const tw0=twrSeries(),tw=tw0&&tw0.length>=4?tw0:null;
  let twr=null,twrAnnual=null;
  if(tw&&tw.length>=2){twr=tw[tw.length-1].base/100-1;
    const d0=new Date(tw[0].m+'-01'),d1=new Date(tw[tw.length-1].m+'-01'),spanY=(d1-d0)/(365.25*86400000);
    if(spanY>0.08)twrAnnual=Math.pow(1+twr,1/spanY)-1;}
  if(twrAnnual!=null&&tw&&tw.length<13)twrAnnual=null;
  return {val,irr,irrPeriod,days,twr,twrAnnual,tw};
}

async function fetchIndexSeries(sym){

let gisReady=false,gTokenClient=null,gAccessToken=null,gTokenExp=0,autoSyncT=null;
function loadGIS(){return new Promise((res,rej)=>{

  const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.async=true;s.defer=true;

function getToken(interactive){return new Promise((res,rej)=>{
  const cid=DB.settings.gdriveClientId; if(!cid)return rej(new Error('ID client manquant'));
  if(gAccessToken&&Date.now()<gTokenExp-60000)return res(gAccessToken);
  if(!gTokenClient||gTokenClient._cid!==cid){
    gTokenClient=google.accounts.oauth2.initTokenClient({client_id:cid,scope:'https://www.googleapis.com/auth/drive.appdata',
      callback:resp=>{if(resp.error){rej(new Error(resp.error));return;}gAccessToken=resp.access_token;gTokenExp=Date.now()+(resp.expires_in||3600)*1000;res(gAccessToken);},
      error_callback:err=>rej(new Error(err&&err.type?err.type:'auth annulée'))});
    gTokenClient._cid=cid;
  }
  try{gTokenClient.callback=resp=>{if(resp.error){rej(new Error(resp.error));return;}gAccessToken=resp.access_token;gTokenExp=Date.now()+(resp.expires_in||3600)*1000;res(gAccessToken);};
    gTokenClient.requestAccessToken({prompt:interactive?'consent':''});}catch(e){rej(e);}});}

async function driveSave(tok,id,obj){

      else{DB.settings.lastSync=new Date().toISOString();applyingRemote=true;save();applyingRemote=false;toast('Déjà à jour ✓');}
    }else{
      const id=await driveSave(tok,null,DB);DB.settings.gdriveFileId=id;DB.settings.lastSync=new Date().toISOString();applyingRemote=true;save();applyingRemote=false;toast('Sauvegardé sur Drive ✓');
    }
    if($('#syncstat'))refreshSyncUI();
  }catch(e){toast('Sync : '+(e.message||e),true);}
}
async function pushQuiet(){
  if(!DB.settings.gdriveClientId)return;
  try{await loadGIS();const tok=await getToken(false);let id=DB.settings.gdriveFileId;
    if(!id){const f=await driveFind(tok);id=f&&f.id;}
    const nid=await driveSave(tok,id,DB);DB.settings.gdriveFileId=nid;DB.settings.lastSync=new Date().toISOString();
    applyingRemote=true;save();applyingRemote=false; if($('#syncstat'))refreshSyncUI();
  }catch(e){}
}

// Chaque opération créée automatiquement porte un lien « crowd:<projet>:<sub|AAAA-MM|cap> » : jamais de doublon,

const wallets=()=>DB.savings.filter(s=>s.type===WALLET);
function walletFor(c){return c&&c.wallet?DB.savings.find(s=>s.name===c.wallet&&s.type===WALLET)||null:null;}
const crowdKey=(c,k)=>'crowd:'+c.id+':'+k;
function crowdLink(c,k){return c&&c.id?DB.movements.find(m=>m.link===crowdKey(c,k))||null:null;}
function crowdUnlink(c,k){if(c&&c.id)DB.movements=DB.movements.filter(m=>m.link!==crowdKey(c,k));}
function crowdUnlinkAll(c){if(c&&c.id)DB.movements=DB.movements.filter(m=>!(m.link&&m.link.startsWith('crowd:'+c.id+':')));}

function crowdCap(c){if(c.st!=='Remboursé'){crowdUnlink(c,'cap');return false;}const w=walletFor(c);if(!w||crowdLink(c,'cap'))return false;
  const e=ymd(addMonths(c.sub,c.dur||0)),t=ymd(today()),d=e<t?e:t,left=Fin.crowdCapitalAt(c,d);if(!(left>0))return false;

function saveSaving(i){const name=$('#s_name').value.trim();if(!name){toast('Nom ?',true);return;}const r=num('s_rate');
  const capIn=num('s_cap'),ceil=num('s_ceil');
  if(DB.savings.some((x,k)=>k!==i&&x.name===name)){toast('Un produit porte déjà ce nom',true);return;}
  // Taux : historique daté, jamais écrasé ; un nouveau taux s'ajoute à sa date d'entrée en vigueur
  let rates=(i>=0&&Array.isArray(DB.savings[i].rates))?DB.savings[i].rates.map(x=>Object.assign({},x)):[];
  if(r==null)rates=[];
  else{if(r<0||r>30){toast('Taux entre 0 et 30 %',true);return;}const from=val('s_rated')||ymd(today()),nr=Math.round(r*1e4)/1e6;
    if(!rates.length||Math.abs(Fin.rateOn(rates,from)-nr)>1e-9){rates=rates.filter(x=>x.from!==from);rates.push({from:rates.length?from:(val('s_open')&&val('s_open')<from?val('s_open'):from),rate:nr});}}
  const o={name,type:$('#s_type').value,bank:$('#s_bank').value.trim(),cap:0,open:val('s_open'),rate:r==null?null:Fin.rateOn(rates,ymd(today())),rates,tax:$('#s_tax').value,ceil};
  if(i>=0){const old=DB.savings[i].name;
    if(old!==name){DB.movements.forEach(m=>{if(m.p===old)m.p=name;if(m.p2===old)m.p2=name;});(DB.crowd||[]).forEach(c=>{if(c.wallet===old)c.wallet=name;});} // opérations et projets suivent le nouveau nom
    DB.savings[i]=o;}else DB.savings.push(o);
  // Capital saisi : on n'écrase pas le solde, on enregistre l'écart comme une opération datée
  // (produit sans aucune opération → dépôt d'ouverture ; sinon → ajustement daté d'aujourd'hui)
  if(capIn!=null){const diff=r2(capIn-savingBalance(o)),hasOps=DB.movements.some(m=>m.p===name||m.p2===name);
    if(Math.abs(diff)>=0.005)DB.movements.push(hasOps
      ?{d:ymd(today()),p:name,t:'Ajustement',q:null,pu:null,m:diff,f:0,n:'Correction du solde'}
      :{d:o.open||ymd(today()),p:name,t:($('#s_held')&&!$('#s_held').checked)?'Dépôt':'Reprise',q:null,pu:null,m:diff,f:0,n:'Solde à l\'ouverture'});}
  save();closeSheet();renderAll();toast('Produit enregistré');}
function delSavingRate(i,from){const s=DB.savings[i];s.rates=(s.rates||[]).filter(x=>x.from!==from);s.rate=s.rates.length?Fin.rateOn(s.rates,ymd(today())):null;save();editSaving(i);}
// Taux affiché dans la fiche : taux en vigueur (historique) ou taux manuel
const rateShown=(s)=>(Array.isArray(s.rates)&&s.rates.length)?Fin.rateOn(s.rates,ymd(today())):((s.rate!=null&&s.rate!=='')?+s.rate:null);
function delSaving(i){const n=DB.savings[i].name;const k=DB.movements.filter(m=>m.p===n||m.p2===n).length;
  if(k&&!confirm('Supprimer « '+n+' » et ses '+k+' opération(s) ?'))return;

function saveCrowd(i){const name=$('#c_name').value.trim();if(!name){toast('Nom ?',true);return;}
  const amt=num('c_amt'),rate=num('c_rate'),dur=num('c_dur'),day=num('c_day');
  if(!(amt>0)){toast('Montant investi ?',true);return;}
  if(rate==null||rate<0||rate>30){toast('Taux annuel entre 0 et 30 % (ex. 10,5)',true);return;}
  if(dur!=null&&!(Number.isInteger(dur)&&dur>0)){toast('Durée en mois entiers',true);return;}
  if(day!=null&&!(Number.isInteger(day)&&day>=1&&day<=31)){toast('Jour de versement entre 1 et 31',true);return;}
  const old=i>=0?DB.crowd[i]:null;
  const o={id:old&&old.id?old.id:'c'+Date.now().toString(36),name,plat:$('#c_plat').value.trim(),amt:r2(amt),rate:Math.round(rate*1e4)/1e6,sub:val('c_sub')||ymd(today()),dur:dur||12,day:day||8,st:$('#c_st').value,
    wallet:$('#c_wallet')?$('#c_wallet').value:(old&&old.wallet)||'',paid:(old?old.paid:[])||[],reps:(old&&old.reps)||[],recv:(old&&old.recv)||[],hold:(old&&old.hold)||[]};
  if(i>=0)DB.crowd[i]=o;else DB.crowd.push(o);
  const w=walletFor(o);let warn='';
  if(!w)crowdUnlinkAll(o); // plus de portefeuille lié : les opérations automatiques sont retirées
  else{
    if($('#c_debit')&&$('#c_debit').checked){const before=savingBalance(w)+(crowdLink(o,'sub')?+crowdLink(o,'sub').m:0);
      crowdSetLink(o,'sub',{d:o.sub,p:w.name,t:'Retrait',m:o.amt,n:'Investissement projet « '+name+' »'});
      if(before<o.amt)warn=' · attention : solde du portefeuille insuffisant ('+eur(before)+')';}
    else crowdUnlink(o,'sub');
    // Intérêts déjà crédités par l'appli : ils suivent le portefeuille, le montant et le taux.
    // On n'en crée JAMAIS rétroactivement (le solde saisi du portefeuille les contient déjà) : seuls les prochains pointages créditent.
    const changed=old&&(old.amt!==o.amt||old.rate!==o.rate);
    (o.paid||[]).forEach(mk=>{const m=crowdLink(o,mk),p=crowdSchedule(o).find(q=>q.mk===mk);if(!m)return;
      if(p){if(changed)crowdSetLink(o,mk,{d:p.ymd,p:w.name,t:'Intérêts',m:crowdNet(o,p),n:'Intérêts projet « '+name+' »'});else crowdSetLink(o,mk,{d:p.ymd,p:w.name,t:'Intérêts',m:m.m,n:'Intérêts projet « '+name+' »'});}else crowdUnlink(o,mk);});
    const cap=crowdLink(o,'cap');if(cap){cap.p=w.name;cap.m=o.amt;}
  }
  if(o.st!=='Remboursé')crowdUnlink(o,'cap');else if(!old||old.st!=='Remboursé')crowdCap(o); // capital recrédité seulement au passage à « Remboursé »
  save();closeSheet();renderAll();nav('placements');setPlace('crowd');toast('Projet enregistré'+warn,!!warn);}
function delCrowd(i){const c=DB.crowd[i],n=DB.movements.filter(m=>m.link&&c.id&&m.link.startsWith('crowd:'+c.id+':')).length;
  if(n&&!confirm('Supprimer « '+c.name+' » et les '+n+' opération'+(n>1?'s':'')+' créée'+(n>1?'s':'')+' sur le portefeuille (paiement, intérêts, capital) ?'))return;

function togglePaid(i,mk){const c=DB.crowd[i];c.paid=c.paid||[];const x=c.paid.indexOf(mk);
  if(x>=0){c.paid.splice(x,1);crowdUnlink(c,mk);}
  else{c.paid.push(mk);const w=walletFor(c),p=crowdSchedule(c).find(q=>q.mk===mk);
    if(w&&p)crowdCredit(c,p);c.hold=(c.hold||[]).filter(x=>x!==mk);}
  save();renderAll();}

function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x||!Array.isArray(x.movements))throw 0;backupLocal('Avant import d\'un fichier');DB=Fin.deserialize(x);load2();save();closeSheet();renderAll();toast('Importé');}catch(x){toast('Fichier invalide',true);}};r.readAsText(f);}

const CG={BTC:'bitcoin','BTC-EUR':'bitcoin',ETH:'ethereum','ETH-EUR':'ethereum',SOL:'solana','SOL-EUR':'solana',ADA:'cardano',XRP:'ripple',DOGE:'dogecoin',BNB:'binancecoin',DOT:'polkadot'};
// Déduit le symbole Yahoo Finance (couvre Euronext Paris / PEA / Amundi sans clé API)
function yahooSym(a){
  if(a.ysym)return a.ysym.trim();
  let t=(a.ticker||'').trim();if(!t)return '';
  if(t.includes('.'))return t.replace(/\.PAR$/i,'.PA'); // .PAR (Alpha Vantage) -> .PA (Yahoo)
  if(a.cur==='USD')return t;                 // US : ticker brut (AAPL…)
  return t+'.PA';                            // défaut Euronext Paris (PEA, Amundi…)
}
async function yahooQuote(sym){
  for(const h of ['https://query1.finance.yahoo.com','https://query2.finance.yahoo.com']){
    try{const r=await fetch(`${h}/v8/finance/chart/${encodeURIComponent(sym)}?interval=1d&range=1d`);
      if(!r.ok)continue;const d=await r.json();
      const m=d&&d.chart&&d.chart.result&&d.chart.result[0]&&d.chart.result[0].meta;
      if(m&&m.regularMarketPrice!=null)return {price:+m.regularMarketPrice,prev:m.chartPreviousClose!=null?+m.chartPreviousClose:(m.previousClose!=null?+m.previousClose:null),cur:(m.currency||'EUR')};
    }catch(e){}
  }
  return null;
}
// Interroge d'abord la fonction Netlify (même origine, aucune limite CORS), sinon Yahoo en direct
async function quoteVia(sym){
  try{const r=await fetch('/.netlify/functions/quote?s='+encodeURIComponent(sym));
    if(r.ok){const d=await r.json();if(d&&d.price!=null)return {price:+d.price,prev:d.prev!=null?+d.prev:null,cur:d.cur||'EUR'};}}catch(e){}
  return await yahooQuote(sym);
}
// Cours de clôture juste avant une date (fin d'année pour la valeur au 1er janvier) : fonction Netlify uniquement
async function quoteAt(sym,d){try{const r=await fetch('/.netlify/functions/quote?s='+encodeURIComponent(sym)+'&d='+d);
  if(r.ok){const j=await r.json();if(j&&j.price!=null&&isFinite(+j.price)&&+j.price>0)return {price:+j.price,cur:j.cur||'EUR'};}}catch(e){}return null;}
const refSym=(a)=>a.type==='Crypto'?((a.ticker||'').includes('-')?a.ticker.trim().toUpperCase():(a.ticker||'').trim().toUpperCase()+'-EUR'):yahooSym(a);
// Récupère (une fois par an) les cours de fin d'année des titres détenus au 1er janvier
async function fetchRefPrices(y){const R=y+'-01-01';DB.refPrices=DB.refPrices||[];let n=0;
  for(const a of DB.assets){if(qtyAt(a,R)<=1e-12||refPrice(a,y)!=null||(a.src||'auto')==='manuel')continue;const sym=refSym(a);if(!sym)continue;
    const q=await quoteAt(sym,R);if(!q)continue;const fx=DB.settings.eurusd||0.92;const px=+toEUR(q.price,q.cur,fx).toFixed(4);
    if(px>0){DB.refPrices.push({y,name:a.name,px,src:'Yahoo '+sym});n++;}}
  return n;}
function toEUR(px,cur,fx){const c=(cur||'EUR').toUpperCase();
  if(c==='EUR')return px; if(c==='USD')return px*fx;
  if(c==='GBP')return px; if(c==='GBX'||c==='GBP5'||c==='GBp')return px/100; return px;}
async function refreshPrices(){
  toast('Actualisation des cours…');
  const rep=[];let n=0;let fx=DB.settings.eurusd||0.92;
  // taux EUR/USD via Yahoo (sinon on garde le dernier connu)
  const needFx=DB.assets.some(a=>a.type!=='Crypto'&&a.cur==='USD');
  if(needFx){const q=await quoteVia('EURUSD=X');if(q&&q.price)fx=1/q.price;}
  // 1) Crypto -> CoinGecko (sans clé)
  const cr=DB.assets.filter(a=>a.type==='Crypto'&&(a.src||'auto')!=='manuel');
  const ids=[...new Set(cr.map(a=>CG[(a.ticker||'').toUpperCase()]).filter(Boolean))];
  let cg=null;
  if(ids.length){try{const r=await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${ids.join(',')}&vs_currencies=eur`);if(r.ok)cg=await r.json();}catch(e){}}
  cr.forEach(a=>{const lp=liveAssetPair(a),lq=lp&&LIVE.quotes[lp];
    if(lq&&Date.now()-lq.t<120000){a.price=lq.px;n++;rep.push([a.name,1,'Kraken (direct)']);return;}
    const id=CG[(a.ticker||'').toUpperCase()];if(id&&cg&&cg[id]&&cg[id].eur){a.price=cg[id].eur;n++;rep.push([a.name,1,'CoinGecko']);}
    else rep.push([a.name,0,'crypto introuvable — ticker type BTC-EUR']);});
  // 2) Actions & ETF -> Yahoo (défaut, couvre Euronext) puis Twelve Data en secours
  const st=DB.assets.filter(a=>a.type!=='Crypto');
  for(const a of st){
    const src=a.src||'auto';
    if(src==='manuel'){rep.push([a.name,2,'cours manuel']);continue;}
    if(!a.ticker&&!a.ysym){rep.push([a.name,0,'pas de ticker']);continue;}
    let done=false;
    if(src==='auto'||src==='yahoo'){
      const sym=yahooSym(a);
      if(sym){const q=await quoteVia(sym);
        if(q){a.price=+toEUR(q.price,q.cur,fx).toFixed(4);const ch=Fin.dayChange(q.price,q.prev);if(ch!=null){a.chg=ch;a.chgT=Date.now();}else{delete a.chg;delete a.chgT;}n++;done=true;rep.push([a.name,1,'Yahoo '+sym+(q.cur&&q.cur.toUpperCase()!=='EUR'?' ('+q.cur+'→€)':'')]);}
      }
    }
    if(!done&&(src==='auto'||src==='twelvedata')&&DB.settings.stockKey){
      try{const r=await fetch(`https://api.twelvedata.com/price?symbol=${encodeURIComponent(a.ticker)}&apikey=${DB.settings.stockKey}`);const d=await r.json();
        const px=d&&d.price?+d.price:null;
        if(px!=null){a.price=a.cur==='USD'?+(px*fx).toFixed(4):px;delete a.chg;delete a.chgT;n++;done=true;rep.push([a.name,1,'Twelve Data']);}
        else rep.push([a.name,0,'Yahoo KO + Twelve Data : '+(d&&d.message?d.message:'indisponible')]);
      }catch(e){rep.push([a.name,0,'indisponible (réseau/CORS)']);}
    } else if(!done){
      rep.push([a.name,0,src==='twelvedata'?'Twelve Data sans clé API':'cours indisponible (Yahoo bloqué ?)']);
    }
  }
  DB.settings.eurusd=fx;DB.settings.lastPriceReport={t:Date.now(),rep};
  try{await fetchRefPrices(today().getFullYear());}catch(e){}
  save();renderAll();
  const okn=rep.filter(x=>x[1]===1).length,bad=rep.filter(x=>x[1]===0).length;
  if(okn)toast(okn+' cours à jour'+(bad?' · '+bad+' en échec (détail ⓘ)':''));
  else toast(bad?'Aucun cours — appuyez sur ⓘ pour le détail':'Rien à actualiser',bad>0);
}
function priceDetail(){
  const r=DB.settings.lastPriceReport;
  if(!r){openSheet(`<div class="spread"><h2>Détail des cours</h2><button class="btn sm" onclick="closeSheet()">Fermer</button></div>${liveReportHtml()}<div class="note">Appuyez sur ↻ pour actualiser les autres cours.</div>`);return;}
  const rows=r.rep.map(x=>`<div class="spread" style="padding:9px 0;border-bottom:1px solid var(--line)"><span style="font-size:13px"><span class="ico-i" style="color:${x[1]===1?'var(--pos)':x[1]===2?'var(--ink2)':'var(--warn)'}">${svgI(x[1]===1?'check':x[1]===2?'hand':'alert')}</span> ${x[0]}</span><span style="font-size:11.5px;color:var(--ink3);text-align:right;max-width:55%">${x[2]}</span></div>`).join('');
  openSheet(`<div class="spread"><h2>Détail des cours ${hq('prices')}</h2><button class="btn sm" onclick="closeSheet()">Fermer</button></div>
   ${liveReportHtml()}
   <div class="note">Dernière actualisation : ${new Date(r.t).toLocaleString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}.</div>
   ${rows}
   `);
}

// ---- Cours crypto en direct : flux public Kraken (WebSocket, sans clé ni compte) ----
// Sécurité : on n'envoie que des noms de paires (« BTC/EUR »), jamais de montant ni de donnée personnelle ;
// chaque cours reçu est filtré (Fin.acceptTick) et n'est jamais inséré tel quel dans la page.
// Connexion ouverte seulement quand l'appli est au premier plan ; coupée en arrière-plan.
const KRAKEN_WS='wss://ws.kraken.com/v2';
const LIVE={ws:null,key:'',status:'off',quotes:{},bad:{},retry:0,timer:null,paint:null,persist:null,dirty:false,unsaved:false,lastDash:0};
function liveOn(){return DB.settings.liveCrypto!==false;}
function liveAssetPair(a){return a&&a.type==='Crypto'&&(a.src||'auto')!=='manuel'?Fin.krakenPair(a.ticker||''):null;}
function livePairs(){return [...new Set(DB.assets.map(liveAssetPair).filter(p=>p&&!LIVE.bad[p]))].sort();}
function liveSync(){
  const pairs=livePairs(),key=pairs.join(',');
  const want=liveOn()&&pairs.length>0&&document.visibilityState!=='hidden'&&typeof WebSocket==='function';
  if(!want){if(LIVE.ws||LIVE.timer)liveStop();LIVE.status=liveOn()?'off':'disabled';return;}
  if((LIVE.ws||LIVE.timer)&&LIVE.key===key)return;
  liveStop();LIVE.key=key;liveConnect(pairs);
}
function liveConnect(pairs){
  let ws;try{ws=new WebSocket(KRAKEN_WS);}catch(e){LIVE.status='error';return;}
  LIVE.ws=ws;LIVE.status='connecting';
  ws.onopen=()=>{if(LIVE.ws!==ws)return;LIVE.retry=0;LIVE.status='on';
    ws.send(JSON.stringify({method:'subscribe',params:{channel:'ticker',snapshot:true,symbol:pairs}}));livePaintSoon();};
  ws.onmessage=(ev)=>{if(LIVE.ws===ws)liveMessage(ev.data);};
  ws.onerror=()=>{};
  ws.onclose=()=>{if(LIVE.ws!==ws)return;LIVE.ws=null;
    if(liveOn()&&document.visibilityState!=='hidden'){const d=Math.min(60000,2000*2**LIVE.retry);LIVE.retry=Math.min(LIVE.retry+1,6);LIVE.status='retry';
      clearTimeout(LIVE.timer);LIVE.timer=setTimeout(()=>{LIVE.timer=null;LIVE.key='';liveSync();},d);}
    else LIVE.status='off';
    livePaintSoon();};
}
function liveStop(){clearTimeout(LIVE.timer);LIVE.timer=null;const ws=LIVE.ws;LIVE.ws=null;LIVE.key='';
  if(ws){try{ws.close();}catch(e){}}LIVE.status='off';livePersist();}
function liveMessage(raw){
  if(typeof raw!=='string'||raw.length>100000)return;
  let m;try{m=JSON.parse(raw);}catch(e){return;}
  if(!m||typeof m!=='object')return;
  if(m.method==='subscribe'&&m.success===false){ // paire inconnue de Kraken : on la retire du direct (CoinGecko prend le relais via ↻)
    const p=String(m.symbol||(m.result&&m.result.symbol)||'').toUpperCase(),q=(String(m.error||'').match(/[A-Z0-9]{2,10}\/EUR/)||[])[0];
    const bad=/^[A-Z0-9]{2,10}\/EUR$/.test(p)?p:q;if(bad&&!LIVE.bad[bad]){LIVE.bad[bad]=1;setTimeout(liveSync,0);}return;}
  if(m.channel!=='ticker'||!Array.isArray(m.data))return;
  const wanted=new Set(livePairs());let changed=false;
  for(const d of m.data.slice(0,50)){
    if(!d||typeof d.symbol!=='string'||!wanted.has(d.symbol))continue;
    const q=LIVE.quotes[d.symbol],px=Fin.acceptTick(q?q.px:null,d.last);if(px==null)continue;
    const chg=typeof d.change_pct==='number'&&Number.isFinite(d.change_pct)&&Math.abs(d.change_pct)<1000?d.change_pct:null;
    LIVE.quotes[d.symbol]={px,chg,t:Date.now()};
    DB.assets.forEach(a=>{if(liveAssetPair(a)===d.symbol&&a.price!==px){a.price=px;changed=true;}});
  }
  if(changed){LIVE.dirty=true;LIVE.unsaved=true;livePaintSoon();if(!LIVE.persist)LIVE.persist=setTimeout(livePersist,300000);}
}
// Enregistrement discret des derniers cours (au plus toutes les 5 min et à la mise en arrière-plan) :
// pas de modification de la date de mise à jour des données, donc pas de synchronisation Drive déclenchée.
function livePersist(){clearTimeout(LIVE.persist);LIVE.persist=null;if(!LIVE.unsaved)return;LIVE.unsaved=false;
  try{localStorage.setItem('investco_v1',JSON.stringify(Fin.serialize(DB)));}catch(e){}}
function livePaintSoon(){if(LIVE.paint)return;LIVE.paint=setTimeout(()=>{LIVE.paint=null;livePaint();},2500);}
function livePaint(){
  document.querySelectorAll('[data-live-badge]').forEach(el=>{el.innerHTML=liveBadgeHtml();});
  if(!LIVE.dirty||document.visibilityState==='hidden'||lockIsOn()||$('#ov').classList.contains('on'))return; // jamais sous une fenêtre ouverte
  const v=document.querySelector('.view.on'),id=v&&v.id,C=window.Chart&&Chart.defaults,an=C?Chart.defaults.animation:undefined;
  try{if(C)Chart.defaults.animation=false;
    if(id==='v-placements'&&placeTab==='bourse'){const tw=document.querySelector('#place-body .twrap'),sl=tw?tw.scrollLeft:0;
      renderPlacements();const tw2=document.querySelector('#place-body .twrap');if(tw2)tw2.scrollLeft=sl;LIVE.dirty=false;}
    else if(id==='v-dash'&&Date.now()-LIVE.lastDash>30000){renderDash();LIVE.lastDash=Date.now();LIVE.dirty=false;}
  }finally{if(C)Chart.defaults.animation=an;}
}
function liveBadgeHtml(){
  if(!liveOn()||!livePairs().length)return '';
  if(LIVE.status==='on')return '<span class="live-b on" title="Cours crypto en direct (Kraken)">● direct</span>';
  return '<span class="live-b" title="Connexion au flux Kraken">○ connexion…</span>';
}
function liveChg(a){
  // Actions / ETF : variation du jour (vs clôture de la veille) issue du dernier ↻, affichée 4 jours au plus
  if(a.type!=='Crypto'){const c=a.chg;if(typeof c!=='number'||!Number.isFinite(c)||!(Date.now()-(+a.chgT||0)<4*864e5))return '';
    return ` · <span class="${c>=0?'pos':'neg'}">${c>=0?'+':''}${fin(r2(c))} % jour</span>`;}
  const p=liveAssetPair(a),q=p&&LIVE.quotes[p];if(!q||q.chg==null||Date.now()-q.t>600000)return '';
  return ` · <span class="${q.chg>=0?'pos':'neg'}">${q.chg>=0?'+':''}${fin(r2(q.chg))} % 24 h</span>`;}
function liveReportHtml(){
  if(!liveOn())return '<div class="note">Cours crypto en direct désactivés (Réglages ▸ Avancé).</div>';
  const P=DB.assets.map(liveAssetPair).filter(Boolean);if(!P.length)return '';
  const st={on:'connecté',connecting:'connexion…',retry:'reconnexion…',off:'en pause',error:'indisponible'}[LIVE.status]||'en pause';
  const rows=[...new Set(P)].map(p=>{const q=LIVE.quotes[p];return `<div class="spread" style="padding:7px 0;border-bottom:1px solid var(--line);font-size:13px"><span><span class="ico-i" style="color:${LIVE.bad[p]?'var(--warn)':q?'var(--pos)':'var(--ink3)'}">${LIVE.bad[p]?svgI('alert'):q?svgI('bolt'):'…'}</span> ${esc(p)}</span><span style="font-size:11.5px;color:var(--ink3)">${LIVE.bad[p]?'non coté sur Kraken : CoinGecko via ↻':q?eur(q.px)+' · il y a '+Math.max(0,Math.round((Date.now()-q.t)/1000))+' s':'en attente'}</span></div>`;}).join('');
  return `<div class="note" style="margin-top:0">Crypto en direct (Kraken) : <b>${st}</b>.</div>${rows}`;
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')liveStop();else liveSync();});
window.addEventListener('pagehide',()=>livePersist());

function applyTheme(){document.documentElement.setAttribute('data-theme',DB.settings.theme||'dark');}
function enableNotif(){if(!('Notification' in window)){toast('Non supporté ici',true);return;}
  Notification.requestPermission().then(p=>{DB.settings.notif=(p==='granted');save();closeSheet();toast(DB.settings.notif?'Rappels activés':'Refusé');});}
function checkAlerts(){if(!DB.settings.notif||!('Notification'in window)||Notification.permission!=='granted')return;
  const msgs=alertsList().map(a=>a.txt);
  if(msgs.length){try{new Notification('Invest.co',{body:msgs.slice(0,3).join('\n'),icon:'icon-192.png'});}catch(e){}}}
function toggleTheme(){DB.settings.theme=(DB.settings.theme==='dark')?'light':'dark';applyTheme();save();renderAll();}
function nav(v){document.querySelectorAll('.view').forEach(x=>x.classList.remove('on'));$('#v-'+v).classList.add('on');
  document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('on',a.dataset.v===v));window.scrollTo(0,0);
  if(v==='dash'){dashAnimated=false;renderDash();}
  if(v==='analyse'){document.querySelector('.nav a[data-v="dash"]').classList.add('on');renderAnalyse();}}
function autoSnapshot(){const now=today();const mk=ymKey(now);const last=DB.settings.lastSnapMonth;
  if(last&&last!==mk){DB.settings.snapshots[last]=DB.settings.snapshots[last]??Math.round(consolidate().net);DB.settings.snapFin=DB.settings.snapFin||{};DB.settings.snapFin[last]=DB.settings.snapFin[last]??Math.round(finValue());}
  DB.settings.lastSnapMonth=mk;}
function renderAll(){if(crowdAutoSync())save();renderDash();renderPlacements();renderBudget();renderRevente();if($('#v-analyse').classList.contains('on'))renderAnalyse();try{liveSync();}catch(e){}}
function hideSplash(){setTimeout(()=>{const s=$('#splash');if(s){s.style.opacity='0';setTimeout(()=>s.remove(),400);}},550);}
function boot(){try{load();applyTheme();runRecurring();autoSnapshot();save();
  $('#asof').textContent='mis à jour le '+today().toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'});
  renderAll();maybeOnboard();checkAlerts();}finally{hideSplash();}
}
// ---- Verrouillage : code haché (PBKDF2) + empreinte / visage (WebAuthn), écran de protection (pas de chiffrement)
const LOCK_ITER=150000;let lockBuf='',lockHiddenAt=0;
// Session déverrouillée : mémorisée dans le sessionStorage de l'onglet (effacé à la fermeture de l'appli),
// pour ne pas redemander le code à chaque rechargement, mise à jour ou passage par le sélecteur de fichiers.
const LOCK_SES='investco_unlocked',LOCK_HID='investco_hidden_at',LOCK_GRACE=10000,LOCK_OPEN_MAX=4*3600*1000;
// Délai de reverrouillage en secondes ; -1 = seulement à l'ouverture de l'appli (0, ancien « Immédiat », vaut -1)
const lockDelay=()=>{const d=lk().delay;return (d==null||d===0)?-1:+d;};
function lockIdleMax(){const d=lockDelay();return d<0?LOCK_OPEN_MAX:Math.max(d*1000,LOCK_GRACE);}
function lockSessionOk(){try{if(!sessionStorage.getItem(LOCK_SES))return false;const h=+sessionStorage.getItem(LOCK_HID)||0;
  return !h||Date.now()-h<lockIdleMax();}catch(e){return false;}}
function lockSessionSet(on){try{if(on){sessionStorage.setItem(LOCK_SES,String(Date.now()));sessionStorage.removeItem(LOCK_HID);}else{sessionStorage.removeItem(LOCK_SES);sessionStorage.removeItem(LOCK_HID);}}catch(e){}}
const lk=()=>DB.settings.lock||{enabled:false};
const b64=(buf)=>btoa(String.fromCharCode(...new Uint8Array(buf))),unb64=(s)=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const randHex=(n)=>[...crypto.getRandomValues(new Uint8Array(n))].map(b=>b.toString(16).padStart(2,'0')).join('');
function lockIsOn(){return $('#lock').classList.contains('on');}
function lockNow(){if(!lk().enabled)return;lockSessionSet(false);lockBuf='';$('#lock').classList.add('on');lockDraw();
  const L=lk();$('#lk-bio').style.display=L.bio?'inline':'none';if(L.bio)setTimeout(()=>{if(lockIsOn())lockBio();},350);}
function lockDraw(msg){const n=lk().len||4;$('#lk-dots').innerHTML=Array.from({length:n},(_,k)=>`<i class="${k<lockBuf.length?'f':''}"></i>`).join('');
  if(msg!=null)$('#lk-msg').textContent=msg;
  if(!$('#lk-pad').children.length)$('#lk-pad').innerHTML=[1,2,3,4,5,6,7,8,9].map(d=>`<button onclick="lockKey('${d}')">${d}</button>`).join('')+`<button class="ghost" onclick="lockKey('C')">Effacer</button><button onclick="lockKey('0')">0</button><button class="ghost" onclick="lockKey('<')">⌫</button>`;}
function lockWait(){const u=+localStorage.getItem('investco_lock_until')||0;return Math.max(0,Math.ceil((u-Date.now())/1000));}
async function lockKey(k){const w=lockWait();if(w){lockDraw('Trop d\'essais : réessayez dans '+w+' s');return;}
  if(k==='C')lockBuf='';else if(k==='<')lockBuf=lockBuf.slice(0,-1);else if(lockBuf.length<(lk().len||4))lockBuf+=k;
  lockDraw('');if(lockBuf.length===(lk().len||4)){const L=lk(),h=await Fin.hashPin(lockBuf,L.salt,L.iter||LOCK_ITER);
    if(h===L.hash){localStorage.removeItem('investco_lock_fails');unlock();}
    else{const f=(+localStorage.getItem('investco_lock_fails')||0)+1;localStorage.setItem('investco_lock_fails',f);lockBuf='';
      $('#lock').classList.remove('shake');void $('#lock').offsetWidth;$('#lock').classList.add('shake');
      if(f>=5){localStorage.setItem('investco_lock_until',Date.now()+30000);localStorage.setItem('investco_lock_fails',0);lockDraw('Trop d\'essais : réessayez dans 30 s');}
      else lockDraw('Code incorrect');}}}
function unlock(){$('#lock').classList.remove('on');lockBuf='';lockSessionSet(true);}
async function lockBio(){const L=lk();if(!L.bio||!window.PublicKeyCredential)return;
  try{await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:[{type:'public-key',id:unb64(L.bio)}],userVerification:'required',timeout:60000}});unlock();}
  catch(e){lockDraw('Empreinte non reconnue : utilisez votre code');}}
function lockForgot(){if(!confirm('Sans le code, la seule solution est d\'effacer toutes les données de l\'application sur cet appareil.\n\nVous pourrez ensuite les restaurer depuis un export ou Google Drive.\n\nContinuer ?'))return;
  if(!confirm('Dernière confirmation : effacer toutes les données Invest.co de cet appareil ?'))return;
  ['investco_v1','patrimoine_v1',BAK_KEY,'investco_lock_fails','investco_lock_until'].forEach(k=>{try{localStorage.removeItem(k);}catch(e){}});location.reload();}
document.addEventListener('keydown',e=>{if(!lockIsOn())return;if(/^\d$/.test(e.key))lockKey(e.key);else if(e.key==='Backspace')lockKey('<');});
// Retour dans l'appli : reverrouillage seulement après le délai choisi (jamais pour un simple aller-retour de quelques secondes)
document.addEventListener('visibilitychange',()=>{if(!lk().enabled)return;
  if(document.visibilityState==='hidden'){lockHiddenAt=Date.now();try{if(!lockIsOn())sessionStorage.setItem(LOCK_HID,String(lockHiddenAt));}catch(e){}}
  else{if(lockHiddenAt&&!lockIsOn()&&Date.now()-lockHiddenAt>=lockIdleMax())lockNow();else{try{sessionStorage.removeItem(LOCK_HID);}catch(e){}}lockHiddenAt=0;}});
// Réglages du verrouillage
function lockSettingsHtml(){const L=lk();
  return `<div class="field" style="border-top:1px solid var(--line);padding-top:14px"><div class="sh-h" style="margin-bottom:8px">${svgI('lock')} Verrouillage ${hq('lock')}</div>
    ${L.enabled?`<div class="row" style="gap:8px;flex-wrap:wrap"><select id="lk_delay" onchange="DB.settings.lock.delay=+this.value;save();toast('Délai enregistré')" style="flex:1;min-width:140px">${[[-1,'À l\'ouverture de l\'appli'],[60,'Après 1 min hors de l\'appli'],[300,'Après 5 min hors de l\'appli'],[900,'Après 15 min hors de l\'appli']].map(([v,l])=>`<option value="${v}" ${lockDelay()===v?'selected':''}>${l}</option>`).join('')}</select>
      <button class="btn sm" onclick="lockBioToggle()">${L.bio?'Désactiver l\'empreinte':svgI('finger')+' Activer l\'empreinte'}</button><button class="btn sm" onclick="lockSetup(true)">Changer le code</button><button class="btn sm" style="color:var(--neg)" onclick="lockDisable()">Désactiver</button></div>
      `
    :`<button class="btn" style="width:100%" onclick="lockSetup(false)">Activer le verrouillage par code</button><div class="hint">Code à 4 à 6 chiffres, et empreinte ou visage si votre téléphone le permet.</div>`}</div>`;}
function lockSetup(change){openSheet(`<div class="spread"><h2>${change?'Changer le':'Choisir un'} code</h2><button class="btn sm" onclick="closeSheet();openSettings()">Retour</button></div>
   ${change?`<div class="field"><label>Code actuel</label><input type="password" inputmode="numeric" autocomplete="off" id="lk_old" maxlength="6"></div>`:''}
   <div class="field"><label>Nouveau code (4 à 6 chiffres)</label><input type="password" inputmode="numeric" autocomplete="off" id="lk_new" maxlength="6"></div>
   <div class="field"><label>Confirmez le code</label><input type="password" inputmode="numeric" autocomplete="off" id="lk_new2" maxlength="6"></div>
   <div class="note" style="margin-top:6px">Retenez bien ce code : s'il est perdu, il faudra effacer les données et les restaurer depuis un export ou Google Drive.</div>
   <button class="btn primary" style="width:100%;margin-top:14px" onclick="lockSave(${change})">Enregistrer</button>`);}
async function lockCheck(pin){const L=lk();return L.enabled&&(await Fin.hashPin(pin,L.salt,L.iter||LOCK_ITER))===L.hash;}
async function lockSave(change){const a=$('#lk_new').value,b=$('#lk_new2').value;
  if(change&&!(await lockCheck($('#lk_old').value))){toast('Code actuel incorrect',true);return;}
  if(!/^\d{4,6}$/.test(a)){toast('Le code doit comporter 4 à 6 chiffres',true);return;}
  if(a!==b){toast('Les deux codes ne correspondent pas',true);return;}
  const salt=randHex(16),hash=await Fin.hashPin(a,salt,LOCK_ITER),old=lk();
  DB.settings.lock={enabled:true,salt,hash,iter:LOCK_ITER,len:a.length,delay:old.delay||-1,bio:old.bio||null};lockSessionSet(true);save();closeSheet();openSettings();toast('Verrouillage activé');}
async function lockDisable(){const pin=prompt('Code actuel pour désactiver le verrouillage :');if(pin==null)return;
  if(!(await lockCheck(pin))){toast('Code incorrect',true);return;}DB.settings.lock={enabled:false};save();closeSheet();openSettings();toast('Verrouillage désactivé');}
async function lockBioToggle(){const L=lk();
  if(L.bio){DB.settings.lock.bio=null;save();closeSheet();openSettings();toast('Empreinte désactivée');return;}
  try{if(!window.PublicKeyCredential||!(await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable())){toast('Empreinte ou visage non disponible sur cet appareil',true);return;}
    const c=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:'Invest.co'},user:{id:crypto.getRandomValues(new Uint8Array(16)),name:'invest.co',displayName:'Invest.co'},
      pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'discouraged'},timeout:60000}});
    DB.settings.lock.bio=b64(c.rawId);save();closeSheet();openSettings();toast('Empreinte activée');}
  catch(e){toast('Activation annulée',true);}}
// ---- Mises à jour de l'appli
let swReg=null;
function showUpdate(){const b=$('#updbar');if(!b)return;b.className='updbar on';b.onclick=applyUpdate;}
function applyUpdate(){backupLocal('Avant mise à jour de l\'appli');
  if(swReg&&swReg.waiting)swReg.waiting.postMessage({type:'SKIP_WAITING'});else location.reload();}
async function checkUpdate(manual){
  if(!swReg){if(manual)toast('Vérification impossible (hors ligne ?)',true);return;}
  try{await swReg.update();}catch(e){if(manual)toast('Vérification impossible (hors ligne ?)',true);return;}
  if(swReg.waiting){showUpdate();if(manual)toast('Nouvelle version prête : touchez la barre orange');}
  else if(manual)toast(swReg.installing?'Téléchargement de la nouvelle version…':'Vous avez la dernière version ('+APP_V+')');}
// « Nouveautés » : affiché une fois après chaque mise à jour
function whatsNew(force){let seen=null;try{seen=localStorage.getItem('investco_seen_version');}catch(e){}
  if(!force&&(seen===APP_V||isFresh)){try{localStorage.setItem('investco_seen_version',APP_V);}catch(e){}return;}
  const r=self.APP_RELEASE||{notes:[]};
  openSheet(`<div class="spread"><h2>Nouveautés de la version ${esc(APP_V)}</h2><button class="btn sm" onclick="closeSheet()">Fermer</button></div>
    <ul style="margin:12px 0 0 18px;line-height:1.55;font-size:13.5px;color:var(--ink2)">${r.notes.map(n=>`<li style="margin-bottom:6px">${esc(n)}</li>`).join('')}</ul>
    <div class="hint" style="margin-top:10px">Une copie de vos données a été faite avant la mise à jour (Réglages ▸ Sauvegardes de sécurité).</div>`);
  try{localStorage.setItem('investco_seen_version',APP_V);}catch(e){}}
// Le service worker est enregistré AVANT le démarrage : même si un écran plante, les mises à jour restent possibles
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>{swReg=reg;
      // Une mise à jour déjà téléchargée et en attente : on la propose tout de suite
      if(reg.waiting&&navigator.serviceWorker.controller)showUpdate();
      reg.addEventListener('updatefound',()=>{const nw=reg.installing;if(!nw)return;
        nw.addEventListener('statechange',()=>{if(nw.state==='installed'&&navigator.serviceWorker.controller)showUpdate();});});
      // Vérifie aussi au retour dans l'appli et toutes les 30 minutes
      document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkUpdate(false);});
      setInterval(()=>checkUpdate(false),30*60*1000);
    }).catch(()=>{});
    // Rechargement seulement quand une nouvelle version remplace l'ancienne (pas à la toute première installation)
    const hadCtrl=!!navigator.serviceWorker.controller;
    let refreshing;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(refreshing||!hadCtrl)return;refreshing=true;location.reload();});
  });
}
try{boot();}catch(e){console.error(e);toast('Erreur au démarrage : '+e.message,true);}
try{if(!lockSessionOk())lockNow();}catch(e){}
setTimeout(()=>{try{whatsNew(false);}catch(e){}},900);
</script>
